<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>MediPrice AI Chatbot Widget</title>
<style>
/* ── PASTE ΑΥΤΟ ΤΟ CSS ΜΕΣΑ ΣΤΟ <style> ΤΟΥ MEDIPRICE ── */

/* Floating Button */
#aiBtn {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 52px;
  height: 52px;
  background: var(--acc, #1a56db);
  color: #fff;
  border: none;
  border-radius: 50%;
  font-size: 22px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(26,86,219,.35);
  z-index: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .2s, box-shadow .2s;
}
#aiBtn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(26,86,219,.45); }
#aiBtn.open { background: #374151; }

/* Side Panel */
#aiPanel {
  position: fixed;
  right: 0; top: 48px; bottom: 0;
  width: 380px;
  background: var(--sur, #fff);
  border-left: 1px solid var(--brd, #e2e6ed);
  display: flex;
  flex-direction: column;
  z-index: 800;
  transform: translateX(100%);
  transition: transform .28s cubic-bezier(.4,0,.2,1);
  box-shadow: -4px 0 24px rgba(0,0,0,.1);
}
#aiPanel.open { transform: translateX(0); }

/* Panel Header */
.ai-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--brd, #e2e6ed);
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--sur, #fff);
  flex-shrink: 0;
}
.ai-header-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #1a56db, #4d7ff5);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.ai-header-title { font-size: 13px; font-weight: 700; color: var(--txt, #111827); }
.ai-header-sub { font-size: 11px; color: var(--mut, #6b7280); }
.ai-close {
  margin-left: auto;
  background: none; border: none;
  color: var(--mut, #6b7280);
  cursor: pointer; font-size: 18px; padding: 4px;
  border-radius: 6px; line-height: 1;
}
.ai-close:hover { background: var(--s2, #f0f2f5); color: var(--txt, #111827); }

/* Messages Area */
#aiMessages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}
#aiMessages::-webkit-scrollbar { width: 3px; }
#aiMessages::-webkit-scrollbar-thumb { background: var(--brd, #e2e6ed); border-radius: 3px; }

/* Message Bubbles */
.ai-msg {
  display: flex;
  flex-direction: column;
  max-width: 88%;
  animation: fadeUp .2s ease;
}
@keyframes fadeUp {
  from { opacity:0; transform: translateY(6px); }
  to   { opacity:1; transform: translateY(0); }
}
.ai-msg.user { align-self: flex-end; }
.ai-msg.bot  { align-self: flex-start; }

.ai-bubble {
  padding: 10px 13px;
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}
.ai-msg.user .ai-bubble {
  background: var(--acc, #1a56db);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.ai-msg.bot .ai-bubble {
  background: var(--s2, #f0f2f5);
  color: var(--txt, #111827);
  border-bottom-left-radius: 4px;
  border: 1px solid var(--brd, #e2e6ed);
}
.ai-msg.bot .ai-bubble.confirm {
  background: #fffbeb;
  border-color: #f59e0b;
}
.ai-msg.bot .ai-bubble.success {
  background: #f0fdf4;
  border-color: #22c55e;
}
.ai-msg.bot .ai-bubble.error {
  background: #fef2f2;
  border-color: #ef4444;
}

.ai-meta {
  font-size: 10px;
  color: var(--mut, #6b7280);
  margin-top: 3px;
  padding: 0 4px;
}
.ai-msg.user .ai-meta { text-align: right; }

/* Confirm Buttons */
.ai-confirm-btns {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.ai-confirm-btns button {
  flex: 1;
  padding: 7px 12px;
  border-radius: 8px;
  border: none;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: opacity .15s;
}
.ai-confirm-btns button:hover { opacity: .85; }
.ai-btn-yes { background: #22c55e; color: #fff; }
.ai-btn-no  { background: var(--brd, #e2e6ed); color: var(--dim, #374151); }

/* Typing Indicator */
.ai-typing {
  display: flex;
  gap: 4px;
  padding: 12px 14px;
  background: var(--s2, #f0f2f5);
  border: 1px solid var(--brd, #e2e6ed);
  border-radius: 14px;
  border-bottom-left-radius: 4px;
  width: fit-content;
  align-self: flex-start;
}
.ai-typing span {
  width: 6px; height: 6px;
  background: var(--mut, #6b7280);
  border-radius: 50%;
  animation: bounce .9s infinite;
}
.ai-typing span:nth-child(2) { animation-delay: .15s; }
.ai-typing span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce {
  0%,60%,100% { transform: translateY(0); }
  30% { transform: translateY(-5px); }
}

/* Quick Actions */
.ai-quickbar {
  padding: 10px 14px;
  border-top: 1px solid var(--brd, #e2e6ed);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  flex-shrink: 0;
  background: var(--sur, #fff);
}
.ai-quick {
  padding: 5px 10px;
  background: var(--s2, #f0f2f5);
  border: 1px solid var(--brd, #e2e6ed);
  border-radius: 20px;
  font-size: 11px;
  color: var(--dim, #374151);
  cursor: pointer;
  font-family: inherit;
  transition: background .15s, border-color .15s;
  white-space: nowrap;
}
.ai-quick:hover {
  background: #dbeafe;
  border-color: var(--acc, #1a56db);
  color: var(--acc, #1a56db);
}

/* Input Area */
.ai-inputbar {
  padding: 12px 14px;
  border-top: 1px solid var(--brd, #e2e6ed);
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-shrink: 0;
  background: var(--sur, #fff);
}
#aiInput {
  flex: 1;
  background: var(--s2, #f0f2f5);
  border: 1px solid var(--brd, #e2e6ed);
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 13px;
  font-family: inherit;
  color: var(--txt, #111827);
  resize: none;
  outline: none;
  max-height: 100px;
  min-height: 38px;
  transition: border-color .2s, box-shadow .2s;
  line-height: 1.4;
}
#aiInput:focus {
  border-color: var(--acc, #1a56db);
  box-shadow: 0 0 0 3px rgba(26,86,219,.1);
}
#aiInput::placeholder { color: var(--mut, #6b7280); }
#aiSend {
  width: 38px; height: 38px;
  background: var(--acc, #1a56db);
  color: #fff;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background .15s, transform .1s;
}
#aiSend:hover { background: #1741b6; }
#aiSend:active { transform: scale(.95); }
#aiSend:disabled { background: var(--brd, #e2e6ed); cursor: not-allowed; }
#aiSend svg { width: 16px; height: 16px; }
</style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════
     ΟΔΗΓΙΕΣ ΕΓΚΑΤΑΣΤΑΣΗΣ
     ════════════════════════════════════════════════════════
  1. Αντέγραψε το CSS παραπάνω μέσα στο <style> του index.html
  2. Αντέγραψε το HTML παρακάτω πριν το κλείσιμο </body>
  3. Αντέγραψε το JavaScript στο τέλος, πριν </script> ή σε νέο <script>
  4. Πρόσθεσε το ANTHROPIC_API_KEY στο κατάλληλο σημείο
     ════════════════════════════════════════════════════════ -->

<!-- HTML: Floating Button + Panel -->
<div id="aiBtn-preview" style="position:relative;display:inline-block;margin:20px;">

<!-- ── FLOATING BUTTON ── -->
<button id="aiBtn" onclick="toggleAI()" title="AI Βοηθός">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
</button>

<!-- ── SIDE PANEL ── -->
<div id="aiPanel">

  <!-- Header -->
  <div class="ai-header">
    <div class="ai-header-icon">🤖</div>
    <div>
      <div class="ai-header-title">MediPrice Βοηθός</div>
      <div class="ai-header-sub">Αναζήτηση &amp; αλλαγές τιμών</div>
    </div>
    <button class="ai-close" onclick="toggleAI()">✕</button>
  </div>

  <!-- Messages -->
  <div id="aiMessages">
    <div class="ai-msg bot">
      <div class="ai-bubble">Γεια σου! 👋 Μπορώ να σε βοηθήσω με:

• Αναζήτηση τιμής επέμβασης
• Αλλαγή τιμής (+/- % ή σταθερή)
• Μαζική αλλαγή σε κατηγορία

Τι θέλεις να κάνουμε;</div>
      <div class="ai-meta">Τώρα</div>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="ai-quickbar">
    <button class="ai-quick" onclick="quickAsk('Ποια η τιμή της χολοκυστεκτομής;')">💰 Τιμή χολής</button>
    <button class="ai-quick" onclick="quickAsk('Αύξησε τις τιμές χολοκυστεκτομής +10%')">📈 +10% χολή</button>
    <button class="ai-quick" onclick="quickAsk('Δείξε μου τις τιμές ορθοπεδικής')">🦴 Ορθοπεδική</button>
    <button class="ai-quick" onclick="quickAsk('Αλλαγές τιμών σε όλη την ουρολογική +5%')">⚕️ Ουρολογική +5%</button>
  </div>

  <!-- Input -->
  <div class="ai-inputbar">
    <textarea id="aiInput" placeholder="Γράψε εντολή... π.χ. 'άλλαξε χολή +30%'" rows="1"
      onkeydown="aiKeyDown(event)" oninput="autoResize(this)"></textarea>
    <button id="aiSend" onclick="sendAI()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

</div><!-- /aiPanel -->
</div><!-- /preview wrapper -->

<script>
// ════════════════════════════════════════════════════════
// MEDIPRICE AI CHATBOT - JAVASCRIPT
// Βάλε αυτό μέσα στο <script> tag του index.html
// ════════════════════════════════════════════════════════

// ── CONFIG ──
var AI_KEY = 'ΑΝΤΙΚΑΤΕΣΤΗΣΕ_ΜΕ_ANTHROPIC_API_KEY'; // ← βάλε εδώ το κλειδί σου
var AI_PANEL_OPEN = false;
var AI_PENDING_ACTION = null; // Αποθηκεύει action που περιμένει επιβεβαίωση
var AI_HISTORY = []; // Ιστορικό συνομιλίας

// ── SUPABASE CONFIG (ήδη υπάρχει στο MediPrice, χρησιμοποιεί τα ίδια) ──
// Αν το βάλεις μέσα στο index.html, χρησιμοποιεί ήδη SB_URL και SB_KEY
// Αν είναι standalone, ορίζουμε εδώ:
var AI_SB_URL = typeof SB_URL !== 'undefined' ? SB_URL : 'https://odtbtugzilxsfqxlpofq.supabase.co';
var AI_SB_KEY = typeof SB_KEY !== 'undefined' ? SB_KEY : 'sb_publishable_ch-7C1ihpZRrxEhXFqV1xA_hXPwq61S';

// ── TOGGLE PANEL ──
function toggleAI() {
  AI_PANEL_OPEN = !AI_PANEL_OPEN;
  document.getElementById('aiPanel').classList.toggle('open', AI_PANEL_OPEN);
  document.getElementById('aiBtn').classList.toggle('open', AI_PANEL_OPEN);
  if (AI_PANEL_OPEN) {
    setTimeout(function(){ document.getElementById('aiInput').focus(); }, 300);
  }
}

// ── QUICK ACTIONS ──
function quickAsk(text) {
  document.getElementById('aiInput').value = text;
  sendAI();
}

// ── AUTO RESIZE TEXTAREA ──
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ── KEYBOARD SEND ──
function aiKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendAI();
  }
}

// ── SEND MESSAGE ──
async function sendAI() {
  var input = document.getElementById('aiInput');
  var text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('aiSend').disabled = true;

  addMsg('user', text);
  AI_HISTORY.push({ role: 'user', content: text });

  showTyping();

  try {
    var response = await callClaude(text);
    hideTyping();
    handleResponse(response);
  } catch(err) {
    hideTyping();
    addMsg('bot', '❌ Σφάλμα επικοινωνίας: ' + err.message, 'error');
  }

  document.getElementById('aiSend').disabled = false;
}

// ── CALL CLAUDE API ──
async function callClaude(userText) {
  // Φτιάχνουμε context με τα διαθέσιμα sheets
  var sheetsContext = await getAvailableSheets();

  var systemPrompt = `Είσαι ο AI βοηθός του MediPrice, του τιμοκαταλόγου του Mediterraneo Hospital.

ΔΙΑΘΕΣΙΜΕΣ ΕΙΔΙΚΟΤΗΤΕΣ/SHEETS:
${sheetsContext}

ΔΥΝΑΤΟΤΗΤΕΣ ΣΟΥ:
1. search_price: Αναζήτηση τιμής επέμβασης
2. update_price: Αλλαγή τιμής (απαιτεί επιβεβαίωση πρώτα)
3. bulk_update: Μαζική αλλαγή ανά ειδικότητα/κατηγορία (απαιτεί επιβεβαίωση)

ΚΑΝΟΝΕΣ:
- Απάντα ΠΑΝΤΑ στα ελληνικά
- Για αλλαγές τιμών: ΠΑΝΤΑ ζήτα επιβεβαίωση πριν κάνεις οτιδήποτε
- Να είσαι συνοπτικός και φιλικός
- Αν δεν βρεις ακριβή αποτέλεσμα, πρότεινε παρόμοια

ΜΟΡΦΗ ΑΠΑΝΤΗΣΗΣ - Επέστρεψε ΠΑΝΤΑ JSON:
{
  "message": "το μήνυμα που θα δείξεις στον χρήστη",
  "action": null | "search" | "confirm_update" | "confirm_bulk",
  "data": { ... } // παράμετροι για την ενέργεια
}

Για αναζητήσεις: action=null, δείξε αποτελέσματα στο message
Για αλλαγές: action="confirm_update" ή "confirm_bulk" με τα δεδομένα στο data
Το data για confirm_update: { sheet, searchTerm, column, changeType: "percent"|"fixed", value, preview }
Το data για confirm_bulk: { sheet, column, changeType: "percent"|"fixed", value }`;

  var resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      system: systemPrompt,
      messages: AI_HISTORY
    })
  });

  if (!resp.ok) throw new Error('API error ' + resp.status);
  var data = await resp.json();
  var content = data.content[0].text;

  // Parse JSON response
  try {
    var clean = content.replace(/```json|```/g, '').trim();
    return JSON.parse(clean);
  } catch(e) {
    return { message: content, action: null, data: null };
  }
}

// ── HANDLE CLAUDE RESPONSE ──
function handleResponse(resp) {
  AI_HISTORY.push({ role: 'assistant', content: JSON.stringify(resp) });

  if (!resp.action || resp.action === null) {
    // Απλή απάντηση
    addMsg('bot', resp.message);
  } else if (resp.action === 'confirm_update' || resp.action === 'confirm_bulk') {
    // Ζητά επιβεβαίωση
    AI_PENDING_ACTION = resp;
    showConfirm(resp.message, resp.action, resp.data);
  }
}

// ── SHOW CONFIRM ──
function showConfirm(message, actionType, data) {
  var msgDiv = document.createElement('div');
  msgDiv.className = 'ai-msg bot';

  var bubble = document.createElement('div');
  bubble.className = 'ai-bubble confirm';
  bubble.textContent = message;

  var btns = document.createElement('div');
  btns.className = 'ai-confirm-btns';

  var yes = document.createElement('button');
  yes.className = 'ai-btn-yes';
  yes.textContent = '✓ Ναι, εφάρμοσε';
  yes.onclick = function() { executeAction(actionType, data); btns.remove(); };

  var no = document.createElement('button');
  no.className = 'ai-btn-no';
  no.textContent = '✕ Ακύρωση';
  no.onclick = function() {
    AI_PENDING_ACTION = null;
    btns.remove();
    addMsg('bot', 'Ακυρώθηκε. Τι άλλο θέλεις;');
  };

  btns.appendChild(yes);
  btns.appendChild(no);
  msgDiv.appendChild(bubble);
  msgDiv.appendChild(btns);

  var meta = document.createElement('div');
  meta.className = 'ai-meta';
  meta.textContent = aiTime();
  msgDiv.appendChild(meta);

  document.getElementById('aiMessages').appendChild(msgDiv);
  scrollAI();
}

// ── EXECUTE ACTION (μετά από επιβεβαίωση) ──
async function executeAction(actionType, data) {
  showTyping();

  try {
    if (actionType === 'confirm_update') {
      await executeSingleUpdate(data);
    } else if (actionType === 'confirm_bulk') {
      await executeBulkUpdate(data);
    }
  } catch(err) {
    hideTyping();
    addMsg('bot', '❌ Σφάλμα κατά την αποθήκευση: ' + err.message, 'error');
  }

  AI_PENDING_ACTION = null;
}

// ── SINGLE PRICE UPDATE ──
async function executeSingleUpdate(data) {
  // Φέρε το sheet από Supabase
  var sheetData = await sbGetSheet(data.sheet);
  if (!sheetData) { hideTyping(); addMsg('bot', '❌ Δεν βρέθηκε το sheet: ' + data.sheet, 'error'); return; }

  var headers = sheetData.headers;
  var rows = sheetData.rows;

  // Βρες το column index
  var colIdx = headers.indexOf(data.column);
  if (colIdx < 0) { hideTyping(); addMsg('bot', '❌ Δεν βρέθηκε η στήλη: ' + data.column, 'error'); return; }

  // Βρες τις γραμμές που ταιριάζουν
  var updated = 0;
  var term = (data.searchTerm || '').toLowerCase();
  rows.forEach(function(row) {
    // Ψάξε σε όλα τα cells της γραμμής
    var match = row.some(function(cell) {
      return cell && cell.toString().toLowerCase().includes(term);
    });
    if (match) {
      var oldVal = parseFloat((row[colIdx] || '0').toString().replace(/[^0-9.,]/g, '').replace(',', '.')) || 0;
      var newVal;
      if (data.changeType === 'percent') {
        newVal = oldVal * (1 + data.value / 100);
      } else {
        newVal = data.value;
      }
      row[colIdx] = Math.round(newVal).toString();
      updated++;
    }
  });

  if (updated === 0) { hideTyping(); addMsg('bot', '⚠️ Δεν βρέθηκαν εγγραφές για: ' + data.searchTerm, 'error'); return; }

  // Αποθήκευση
  await sbSaveSheet(data.sheet, headers, rows);

  // Refresh αν είμαστε στο ίδιο sheet
  if (typeof showSheet === 'function' && typeof cur !== 'undefined' && cur === data.sheet) {
    if (typeof D !== 'undefined' && D[cur]) {
      D[cur].rows = rows;
      showSheet(cur);
    }
  }

  hideTyping();
  addMsg('bot', '✅ Ενημερώθηκαν ' + updated + ' εγγραφές στο "' + data.sheet + '"!\n\nΟι αλλαγές αποθηκεύτηκαν στη βάση.', 'success');
}

// ── BULK UPDATE ──
async function executeBulkUpdate(data) {
  var sheetData = await sbGetSheet(data.sheet);
  if (!sheetData) { hideTyping(); addMsg('bot', '❌ Δεν βρέθηκε το sheet.', 'error'); return; }

  var headers = sheetData.headers;
  var rows = sheetData.rows;
  var colIdx = headers.indexOf(data.column);
  if (colIdx < 0) { hideTyping(); addMsg('bot', '❌ Δεν βρέθηκε η στήλη: ' + data.column, 'error'); return; }

  var updated = 0;
  rows.forEach(function(row) {
    var oldVal = parseFloat((row[colIdx] || '0').toString().replace(/[^0-9.,]/g, '').replace(',', '.')) || 0;
    if (oldVal > 0) {
      var newVal;
      if (data.changeType === 'percent') {
        newVal = oldVal * (1 + data.value / 100);
      } else {
        newVal = data.value;
      }
      row[colIdx] = Math.round(newVal).toString();
      updated++;
    }
  });

  await sbSaveSheet(data.sheet, headers, rows);

  if (typeof showSheet === 'function' && typeof cur !== 'undefined' && cur === data.sheet) {
    if (typeof D !== 'undefined' && D[cur]) {
      D[cur].rows = rows;
      showSheet(cur);
    }
  }

  hideTyping();
  addMsg('bot', '✅ Μαζική αλλαγή ολοκληρώθηκε!\n\nΕνημερώθηκαν ' + updated + ' τιμές στο "' + data.sheet + '".', 'success');
}

// ── SUPABASE HELPERS ──
async function getAvailableSheets() {
  try {
    var r = await fetch(AI_SB_URL + '/rest/v1/mediprice_sheets?select=sheet_name', {
      headers: { apikey: AI_SB_KEY, Authorization: 'Bearer ' + AI_SB_KEY }
    });
    var data = await r.json();
    return data.map(function(d){ return d.sheet_name; }).join(', ');
  } catch(e) { return 'Δεν ήταν δυνατή η φόρτωση ειδικοτήτων'; }
}

async function sbGetSheet(sheetName) {
  var r = await fetch(AI_SB_URL + '/rest/v1/mediprice_sheets?sheet_name=eq.' + encodeURIComponent(sheetName) + '&select=*', {
    headers: { apikey: AI_SB_KEY, Authorization: 'Bearer ' + AI_SB_KEY }
  });
  var data = await r.json();
  return data && data[0] ? data[0] : null;
}

async function sbSaveSheet(sheetName, headers, rows) {
  var existing = await sbGetSheet(sheetName);
  var method = existing ? 'PATCH' : 'POST';
  var url = AI_SB_URL + '/rest/v1/mediprice_sheets' + (existing ? '?sheet_name=eq.' + encodeURIComponent(sheetName) : '');
  await fetch(url, {
    method: method,
    headers: { apikey: AI_SB_KEY, Authorization: 'Bearer ' + AI_SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify({ sheet_name: sheetName, headers: headers, rows: rows, updated_at: new Date().toISOString() })
  });
}

// ── UI HELPERS ──
function addMsg(role, text, type) {
  var msgDiv = document.createElement('div');
  msgDiv.className = 'ai-msg ' + role;

  var bubble = document.createElement('div');
  bubble.className = 'ai-bubble' + (type ? ' ' + type : '');
  bubble.textContent = text;

  var meta = document.createElement('div');
  meta.className = 'ai-meta';
  meta.textContent = aiTime();

  msgDiv.appendChild(bubble);
  msgDiv.appendChild(meta);
  document.getElementById('aiMessages').appendChild(msgDiv);
  scrollAI();
}

var typingEl = null;
function showTyping() {
  typingEl = document.createElement('div');
  typingEl.className = 'ai-typing';
  typingEl.innerHTML = '<span></span><span></span><span></span>';
  document.getElementById('aiMessages').appendChild(typingEl);
  scrollAI();
}
function hideTyping() {
  if (typingEl) { typingEl.remove(); typingEl = null; }
}

function scrollAI() {
  var m = document.getElementById('aiMessages');
  m.scrollTop = m.scrollHeight;
}

function aiTime() {
  return new Date().toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' });
}
