<!-- =====================================================
     MOBILE DETECTION — αν κινητό, κρύβει το desktop UI
====================================================== -->
<script>
var IS_MOBILE = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
  || Math.min(window.screen.width, window.screen.height) < 768;
if (IS_MOBILE) document.documentElement.classList.add('is-mobile');
</script>

<!-- Mobile styles — εφαρμόζονται μόνο σε κινητά -->
<style>
/* Στο desktop κρύβουμε το mobile UI και στο κινητό κρύβουμε το desktop */
html.is-mobile .desktop-only { display: none !important; }
html:not(.is-mobile) .mobile-only { display: none !important; }

/* ── Mobile App ── */
html.is-mobile, html.is-mobile body {
  height: 100%; overflow: hidden;
  background: #f0f4f8;
  font-family: 'Inter', sans-serif;
}
#m-app {
  display: flex; flex-direction: column;
  height: 100vh; overflow: hidden;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: #111827;
}
#m-topbar {
  background: #1a56db;
  padding: 14px 16px 12px;
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}
#m-topbar .m-logo { font-size: 1.2rem; font-weight: 700; color: #fff; line-height: 1; }
#m-topbar .m-logo span { color: #fca5a5; }
#m-topbar .m-sub { font-size: .7rem; color: rgba(255,255,255,.65); margin-top: 2px; }
#m-topbar .m-badge {
  margin-left: auto; background: rgba(255,255,255,.15);
  color: #fff; border-radius: 20px; padding: 2px 10px;
  font-size: .7rem; white-space: nowrap;
}
#m-search-area {
  background: #fff; padding: 10px 12px;
  border-bottom: 1px solid #e2e6ed; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 8px;
}
.m-select, .m-input {
  width: 100%; border: 1.5px solid #e2e6ed;
  border-radius: 10px; padding: 10px 13px;
  font-size: .9rem; font-family: inherit;
  background: #f5f7fa; color: #111827; outline: none;
  -webkit-appearance: none;
}
.m-select:focus, .m-input:focus {
  border-color: #1a56db; background: #fff;
}
.m-select-wrap { position: relative; display: flex; align-items: center; }
.m-select-wrap .m-select { flex: 1; padding-right: 36px; }
.m-sel-clr {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  background: #9ca3af; color: #fff; border: none; border-radius: 50%;
  width: 20px; height: 20px; font-size: 10px; cursor: pointer;
  display: none; align-items: center; justify-content: center; padding: 0;
  line-height: 1;
}
.m-sel-clr.visible { display: flex; }
.m-search-wrap .m-input { padding-left: 36px; }
.m-search-wrap::before {
  content: "🔍"; position: absolute; left: 11px; top: 50%;
  transform: translateY(-50%); font-size: .85rem; pointer-events: none;
}
#m-results-area {
  flex: 1; overflow-y: auto; padding: 10px 12px 24px;
  -webkit-overflow-scrolling: touch;
}
#m-count {
  font-size: .75rem; color: #6b7280;
  text-align: center; padding: 4px 0 6px;
}
.m-card {
  background: #fff; border-radius: 12px;
  box-shadow: 0 1px 6px rgba(0,0,0,.09);
  padding: 12px 14px; margin-bottom: 9px;
  border-left: 4px solid #1a56db;
  animation: mfade .18s ease;
}
@keyframes mfade { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
.m-card-sp {
  font-size: .68rem; font-weight: 700; color: #1a56db;
  letter-spacing: .04em; text-transform: uppercase; margin-bottom: 3px;
}
.m-card-name {
  font-size: .88rem; font-weight: 600; line-height: 1.35;
  color: #111827;
}
.m-card-prices {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.m-price-chip {
  font-size: .75rem; border-radius: 6px; padding: 3px 8px;
  font-weight: 600; white-space: nowrap;
}
.m-price-chip.eoppy { background: #f0fdf4; color: #166534; }
.m-price-chip.idiotis { background: #eff6ff; color: #1e40af; }
.m-state {
  text-align: center; padding: 50px 20px; color: #6b7280;
}
.m-state .m-emoji { font-size: 2.2rem; margin-bottom: 10px; }
.m-state p { font-size: .88rem; line-height: 1.6; }
.m-spin {
  width: 28px; height: 28px; border: 3px solid #e2e6ed;
  border-top-color: #1a56db; border-radius: 50%;
  animation: sp .8s linear infinite; margin: 0 auto 12px;
}
.m-card-top {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  margin-bottom: 8px;
}
.m-card-expandable { cursor: pointer; }
.m-card-open { border-left-color: #059669; }
.m-expand-icon {
  font-size: .65rem; color: #9ca3af; flex-shrink: 0;
  margin-top: 4px; transition: transform .2s;
}
.m-drawer {
  display: none; margin-top: 10px;
  border-top: 1px solid #e2e6ed; padding-top: 10px;
}
.m-drawer.open { display: block; }
.m-drawer-row {
  display: flex; gap: 8px; padding: 4px 0;
  border-bottom: 1px solid #f1f5f9; font-size: .8rem;
  align-items: flex-start;
}
.m-drawer-row:last-child { border-bottom: none; }
.m-drawer-label {
  color: #6b7280; font-weight: 600; flex-shrink: 0;
  min-width: 120px; max-width: 140px; line-height: 1.4;
}
.m-drawer-val {
  color: #111827; line-height: 1.4; flex: 1; word-break: break-word;
}
</style>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{--bg:#f5f7fa;--sur:#fff;--s2:#f0f2f5;--brd:#e2e6ed;--acc:#1a56db;--txt:#111827;--mut:#6b7280;--dim:#374151;--grn:#059669;--r:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;font-size:13px;background:var(--bg);color:var(--txt);}
header{height:48px;background:var(--sur);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);flex-shrink:0;}
.logo{font-size:16px;letter-spacing:-.3px;white-space:nowrap;}
.logo .m{font-weight:700;color:#1a56db;}.logo .p{font-weight:700;color:#e53e3e;}
.sep{width:1px;height:20px;background:var(--brd);}
.hosp{font-size:12px;color:var(--mut);white-space:nowrap;}
.badge{background:var(--s2);border:1px solid var(--brd);border-radius:20px;padding:2px 10px;font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;white-space:nowrap;margin-left:auto;}
.sw{position:relative;flex:1;max-width:420px;}
.si{width:100%;background:var(--s2);border:1px solid var(--brd);border-radius:var(--r);padding:6px 28px 6px 30px;color:var(--txt);font-size:13px;font-family:inherit;outline:none;transition:all .2s;}
.si:focus{border-color:var(--acc);background:var(--sur);box-shadow:0 0 0 3px rgba(26,86,219,.1);}
.si::placeholder{color:var(--mut);}
.sico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none;}
.sclr{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:var(--mut);color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:9px;cursor:pointer;display:none;align-items:center;justify-content:center;}
.main{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 48px);overflow:hidden;}

.spl{flex:1;overflow-y:auto;padding:4px;}

.spi.active .spn{color:var(--acc);font-weight:600;}
.spn{font-size:12px;font-weight:500;color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.spi.active .spc{background:#dbeafe;color:var(--acc);}
.content{display:flex;flex-direction:column;overflow:hidden;}
.ch{padding:8px 14px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px;background:var(--sur);flex-shrink:0;min-height:42px;}
.ct{font-size:14px;font-weight:600;white-space:nowrap;}
.cs{font-size:12px;color:var(--mut);}
#ta{flex:1;overflow:auto;}
#ta::-webkit-scrollbar{width:5px;height:5px;}
#ta::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px;}
table{border-collapse:collapse;font-size:13px;background:var(--sur);table-layout:fixed;width:max-content;}
thead{position:sticky;top:0;z-index:10;}
th{background:#eef1f6;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px;padding:6px 8px;text-align:left;border-bottom:2px solid var(--brd);border-right:1px solid var(--brd);white-space:normal;word-break:break-word;vertical-align:top;position:relative;}

th.ec{background:#f0fdf4;color:#166534;}
th.pc{background:#eff6ff;color:#1e40af;}
td{padding:5px 8px;border-bottom:1px solid #f1f5f9;border-right:1px solid #eef0f5;white-space:normal;word-break:break-word;line-height:1.4;vertical-align:top;}
td.wrap{white-space:normal;word-break:break-word;line-height:1.4;} /* same as td */
td.ev{background:#f0fdf4;font-weight:600;color:#166534;text-align:right;font-family:'DM Mono',monospace;font-size:12px;}
td.pv{background:#eff6ff;font-weight:600;color:#1e40af;text-align:right;font-family:'DM Mono',monospace;font-size:12px;}
td:last-child{border-right:none;}
tbody tr{height:56px;}tbody tr:nth-child(even) td{background:#f7f9fc;}

tbody tr:nth-child(even) td.pv{background:#e8f0fe;}
tbody tr:hover td{background:#eef4ff!important;cursor:pointer;}
tbody tr.sel td{background:#dbeafe!important;}
.spbadge{font-size:10px;font-weight:600;color:var(--acc);background:#eff6ff;border-radius:4px;padding:2px 5px;white-space:nowrap;}
mark{background:#fef08a;color:#713f12;border-radius:2px;padding:0 1px;}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:80px 40px;height:100%;color:var(--mut);}
.state-icon{font-size:40px;opacity:.2;}
.state-title{font-size:15px;font-weight:600;color:var(--dim);}
.state-sub{font-size:13px;text-align:center;max-width:300px;line-height:1.6;}
.spin{width:24px;height:24px;border:2px solid var(--brd);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto;}
@keyframes sp{to{transform:rotate(360deg);}}
.resizer{position:absolute;right:0;top:0;width:6px;height:100%;cursor:col-resize;z-index:2;}
.resizer:hover{background:rgba(26,86,219,.3);}
.tbl-title{background:#1e40af;color:#fff;font-size:12px;font-weight:600;padding:6px 10px;letter-spacing:.3px;}
#tooltip{position:fixed;background:#1f2937;color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;max-width:340px;white-space:normal;word-break:break-word;z-index:9999;pointer-events:none;line-height:1.5;box-shadow:0 4px 12px rgba(0,0,0,.25);display:none;}

/* Edit mode */
.edit-bar{display:none;position:fixed;bottom:0;left:220px;right:0;background:#1e40af;color:#fff;padding:8px 16px;z-index:500;align-items:center;gap:10px;font-size:12px;}
.edit-bar.show{display:flex;}
.edit-bar button{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:inherit;}
.edit-bar button:hover{background:rgba(255,255,255,.3);}
.edit-bar .spacer{flex:1;}
.edit-bar .saved{background:#059669;border-color:#059669;}
.edit-btn{position:fixed;bottom:60px;right:20px;background:#1e40af;color:#fff;border:none;border-radius:50px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:600;font-family:inherit;}
.edit-btn.active{background:#059669;}
.edit-mode th{cursor:pointer;}
.edit-mode th.col-selected{background:#dbeafe!important;color:#1a56db!important;outline:2px solid #1a56db;}
.edit-mode th:hover{background:#dbeafe;}
.edit-mode td{cursor:cell;}
td.editing, th.editing{padding:0!important;overflow:visible!important;}
td.editing input, th.editing input{width:100%;min-width:200px;border:2px solid #1a56db;outline:none;padding:4px 8px;font-size:13px;font-family:inherit;background:#fff;min-height:28px;position:relative;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.15);}
.row-actions{display:none;position:absolute;left:-28px;top:50%;transform:translateY(-50%);gap:2px;}
.edit-mode tbody tr{position:relative;}
.edit-mode tr:hover .row-actions{display:flex;}
.row-actions button{width:22px;height:22px;border:none;border-radius:4px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0;}
.row-actions .ins{background:#dbeafe;color:#1a56db;}

.add-row-btn{display:none;background:#f0fdf4;border:1px dashed #059669;color:#059669;width:100%;padding:6px;text-align:center;cursor:pointer;font-size:12px;font-family:inherit;}
.edit-mode .add-row-btn{display:block;}
.add-col-btn{display:none;background:#eff6ff;border:1px dashed #1a56db;color:#1a56db;padding:6px 10px;cursor:pointer;font-size:12px;font-family:inherit;white-space:nowrap;}
.edit-mode .add-col-btn{display:inline-block;}
.notice{position:fixed;top:60px;right:20px;background:#1e40af;color:#fff;border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600;z-index:1000;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.price-mode th[data-hi]{cursor:crosshair!important;}
.price-mode th[data-hi]:hover{background:#fef9c3!important;color:#713f12!important;}

#pricePanel{display:none;position:fixed;bottom:52px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;border-radius:10px;padding:12px 16px;z-index:700;box-shadow:0 8px 24px rgba(0,0,0,.3);align-items:center;gap:8px;font-size:12px;white-space:nowrap;}

#pricePanel input[type=number]::-webkit-inner-spin-button{opacity:1;}
</style>

function pushUndo(){
  if(!cur||!D[cur]) return;
  if(D[cur].__multi__){
    UNDO_STACK.push({sheet:cur,multi:true,tables:JSON.parse(JSON.stringify(D[cur].tables))});
  } else {
    var d=D[cur];
    UNDO_STACK.push({sheet:cur,multi:false,headers:JSON.parse(JSON.stringify(d.headers)),rows:JSON.parse(JSON.stringify(d.rows))});
  }
  if(UNDO_STACK.length>20) UNDO_STACK.shift();
  document.getElementById('undoBtn').disabled=false;
}

function undo(){
  if(!UNDO_STACK.length) return;
  var state=UNDO_STACK.pop();
  if(D[state.sheet]){
    if(state.multi) D[state.sheet].tables=state.tables;
    else{D[state.sheet].headers=state.headers;D[state.sheet].rows=state.rows;}
    if(cur===state.sheet) showSheet(cur);
    markPending();
  }
  if(!UNDO_STACK.length) document.getElementById('undoBtn').disabled=true;
}

function rowCount(d){
  if(!d) return 0;
  if(d.__multi__) return d.tables.reduce(function(s,t){return s+t.rows.length;},0);
  return d.rows?d.rows.length:0;
}

// ── SUPABASE ──────────────────────────────────────────────
async function sbGet(sheet){
  var r=await fetch(SB_URL+'/rest/v1/mediprice_sheets?sheet_name=eq.'+encodeURIComponent(sheet)+'&select=*',{
    headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}
  });
  var d=await r.json();
  return d&&d[0]?d[0]:null;
}

async function sbSave(sheet, headers, rows){
  var existing=await sbGet(sheet);
  var method=existing?'PATCH':'POST';
  var url=SB_URL+'/rest/v1/mediprice_sheets'+(existing?'?sheet_name=eq.'+encodeURIComponent(sheet):'');
  var payload={sheet_name:sheet,headers:headers,rows:rows,updated_at:new Date().toISOString()};
  if(COL_WIDTHS[sheet]) payload.col_widths=COL_WIDTHS[sheet];
  var resp=await fetch(url,{
    method:method,
    headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify(payload)
  });
  // Αν αποτύχει λόγω missing col_widths column, δοκίμασε χωρίς αυτό
  if(!resp.ok && COL_WIDTHS[sheet]){
    delete payload.col_widths;
    await fetch(url,{
      method:method,
      headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
      body:JSON.stringify(payload)
    });
    showNotice('⚠️ Τα πλάτη στηλών χρειάζονται migration DB');
  }
}

async function sbSaveMulti(sheet){
  var d=D[sheet]; if(!d||!d.__multi__) return;
  var existing=await sbGet(sheet);
  var method=existing?'PATCH':'POST';
  var url=SB_URL+'/rest/v1/mediprice_sheets'+(existing?'?sheet_name=eq.'+encodeURIComponent(sheet):'');
  var payload={sheet_name:sheet,headers:JSON.stringify(d.tables),rows:[],updated_at:new Date().toISOString()};
  if(COL_WIDTHS[sheet]) payload.col_widths=COL_WIDTHS[sheet];
  var resp=await fetch(url,{
    method:method,
    headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify(payload)
  });
  if(!resp.ok && COL_WIDTHS[sheet]){
    delete payload.col_widths;
    await fetch(url,{
      method:method,
      headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
      body:JSON.stringify(payload)
    });
    showNotice('⚠️ Τα πλάτη στηλών χρειάζονται migration DB');
  }
}

function markPending(){
  PENDING=true;
  document.getElementById('saveBtn').style.background='#f59e0b';
  document.getElementById('saveBtn').style.borderColor='#f59e0b';
  document.getElementById('saveBtn').textContent='⚠️ Αποθήκευση εκκρεμεί';
}

async function saveAll(){
  if(!cur||!D[cur]) return;
  document.getElementById('saveBtn').textContent='⏳ Αποθήκευση...';
  if(D[cur].__multi__){
    await sbSaveMulti(cur);
  } else {
    var d=D[cur];
    await sbSave(cur, d.headers, d.rows);
  }
  PENDING=false;
  document.getElementById('saveBtn').style.background='#059669';
  document.getElementById('saveBtn').textContent='✓ Αποθηκεύτηκε';
  setTimeout(function(){
    document.getElementById('saveBtn').style.background='';
    document.getElementById('saveBtn').style.borderColor='';
    document.getElementById('saveBtn').textContent='💾 Αποθήκευση';
  },2000);
}

async function loadSheetFromSB(sheet){
  var d=await sbGet(sheet);
  if(d){
    if(D[sheet]&&D[sheet].__multi__&&d.headers){
      try{
        var tables=typeof d.headers==='string'?JSON.parse(d.headers):d.headers;
        if(Array.isArray(tables)) D[sheet].tables=tables;
      }catch(e){}
    } else if(D[sheet]&&!D[sheet].__multi__){
      D[sheet].headers=d.headers;
      D[sheet].rows=d.rows;
    }
    // Load saved column widths
    if(d.col_widths && typeof d.col_widths==='object'){
      COL_WIDTHS[sheet]=d.col_widths;
    }
    return true;
  }
  return false;
}

function showNotice(msg){
  var n=document.createElement('div');
  n.className='notice';n.textContent=msg;
  document.body.appendChild(n);
  setTimeout(function(){n.remove();},2000);
}

function toggleEdit(){
  if(!EDIT_MODE){
    var pass=prompt('Κωδικός επεξεργασίας:');
    if(pass!==EDIT_PASS){if(pass!==null)alert('Λάθος κωδικός!');return;}
    EDIT_MODE=true;
    document.body.classList.add('edit-mode');
    document.getElementById('editBtn').textContent='✅ Επεξεργασία';
    document.getElementById('editBtn').classList.add('active');
    document.getElementById('editBar').classList.add('show');
    document.getElementById('ta').style.paddingBottom='50px';
  } else {
    EDIT_MODE=false;
    document.body.classList.remove('edit-mode');
    document.getElementById('editBtn').textContent='✏️ Επεξεργασία';
    document.getElementById('editBtn').classList.remove('active');
    document.getElementById('editBar').classList.remove('show');
    document.getElementById('ta').style.paddingBottom='';
  }
  if(cur) showSheet(cur);
}

function getCurrentData(tableIdx){
  if(!cur||!D[cur]) return null;
  if(D[cur].__multi__){
    if(tableIdx===undefined) return null;
    return D[cur].tables[tableIdx]||null;
  }
  return D[cur];
}

function makeEditable(el, onSave){
  pushUndo();
  var orig=el.textContent;
  el.classList.add('editing');
  var isTh=el.tagName==='TH'||!!el.closest('th');
  var inp=document.createElement(isTh?'input':'textarea');
  if(isTh) inp.type='text';
  inp.value=orig;
  inp.style.width='100%';
  inp.style.boxSizing='border-box';
  inp.style.border='2px solid #1a56db';
  inp.style.outline='none';
  inp.style.padding='4px 8px';
  inp.style.fontSize='13px';
  inp.style.fontFamily='inherit';
  inp.style.background='#fff';
  inp.style.lineHeight='1.4';
  if(!isTh){
    inp.style.resize='none';
    inp.style.overflow='hidden';
    inp.style.whiteSpace='pre-wrap';
    inp.style.wordBreak='break-word';
  }
  el.innerHTML=''; el.appendChild(inp);
  inp.focus(); inp.select();
  if(!isTh){
    inp.style.height='auto';
    inp.style.height=Math.max(inp.scrollHeight,28)+'px';
    inp.addEventListener('input',function(){inp.style.height='auto';inp.style.height=Math.max(inp.scrollHeight,28)+'px';});
  }
  var saved=false;
  function done(){
    if(saved) return; saved=true;
    var nv=inp.value;
    el.classList.remove('editing');
    el.textContent=nv;
    if(nv!==orig){onSave(nv); markPending();}
  }
  inp.addEventListener('blur',done);
  inp.addEventListener('keydown',function(e){
    if(e.key==='Escape'){saved=true;el.classList.remove('editing');el.textContent=orig;}
    if(isTh&&e.key==='Enter'){e.preventDefault();inp.blur();}
    if(!isTh&&e.key==='Enter'&&e.ctrlKey){inp.blur();}
    e.stopPropagation();
  });
}

// ── PRICE MODE ────────────────────────────────────────────
var PRICE_MODE=false, PRICE_COL=null, PRICE_COL_NAME='';

function togglePriceMode(){
  if(PRICE_MODE){ cancelPriceMode(); return; }
  PRICE_MODE=true;
  document.getElementById('pricePanel').classList.add('show');
  document.getElementById('pricePanelCol').style.display='none';
  document.getElementById('priceBtns').style.display='none';
  document.querySelector('#pricePanel span:nth-child(2)').style.display='';
  document.getElementById('priceBtn').style.background='#ca9a06';
  document.getElementById('ta').classList.add('price-mode');
  // Προσθήκη click listeners στα headers
  document.querySelectorAll('thead th[data-hi]').forEach(function(th){
    th.addEventListener('click', onPriceHeaderClick);
  });
}

function onPriceHeaderClick(e){
  if(!PRICE_MODE) return;
  e.stopPropagation();
  // Αφαίρεση προηγούμενης επιλογής
  document.querySelectorAll('thead th.price-selected').forEach(function(t){t.classList.remove('price-selected');});
  document.querySelectorAll('td.price-highlight').forEach(function(t){t.classList.remove('price-highlight');});
  var th=e.currentTarget;
  th.classList.add('price-selected');
  PRICE_COL=parseInt(th.dataset.hi);
  PRICE_COL_NAME=th.textContent.replace(/\s+/g,' ').trim();
  // Highlight στήλης
  document.querySelectorAll('tbody td[data-ci="'+PRICE_COL+'"]').forEach(function(td){
    var v=parseFloat(td.textContent.trim());
    if(!isNaN(v) && v!==0) td.classList.add('price-highlight');
  });
  // Εμφάνιση panel με κουμπιά
  document.getElementById('pricePanelCol').textContent=PRICE_COL_NAME;
  document.getElementById('pricePanelCol').style.display='';
  document.getElementById('priceBtns').style.display='flex';
  document.querySelector('#pricePanel span:nth-child(2)').style.display='none';
}

function applyPct(pct){
  if(PRICE_COL===null) return;
  var d=getCurrentData(); if(!d) return;
  pushUndo();
  d.rows.forEach(function(row){
    var v=parseFloat(String(row[PRICE_COL]).trim());
    if(!isNaN(v) && v!==0){
      row[PRICE_COL]=String(Math.round(v*(1+pct/100)));
    }
  });
  showNotice((pct>0?'+':'')+pct+'% εφαρμόστηκε στη στήλη "'+PRICE_COL_NAME+'"');
  markPending();
  cancelPriceMode();
  showSheet(cur);
}

function applyCustomPct(){
  var pct=parseFloat(document.getElementById('customPct').value);
  if(isNaN(pct)){ alert('Εισάγετε έγκυρο ποσοστό'); return; }
  applyPct(pct);
}

function cancelPriceMode(){
  PRICE_MODE=false; PRICE_COL=null; PRICE_COL_NAME='';
  document.getElementById('pricePanel').classList.remove('show');
  document.getElementById('priceBtn').style.background='#eab308';
  document.getElementById('ta').classList.remove('price-mode');
  document.querySelectorAll('thead th.price-selected').forEach(function(t){t.classList.remove('price-selected');});
  document.querySelectorAll('td.price-highlight').forEach(function(t){t.classList.remove('price-highlight');});
  document.querySelectorAll('thead th[data-hi]').forEach(function(th){
    th.removeEventListener('click', onPriceHeaderClick);
  });
}

function addRow(){
  var d=getCurrentData(); if(!d) return;
  pushUndo();
  var empty=d.headers.map(function(){return '';});
  var ta=document.getElementById('ta');
  var scrollTop=ta.scrollTop;
  var insertedRi=null;
  var selTr=document.querySelector('#ta tbody tr.sel');
  if(selTr){
    var ri=parseInt(selTr.dataset.ri);
    if(!isNaN(ri)){ d.rows.splice(ri+1,0,empty); insertedRi=ri+1; }
    else { d.rows.push(empty); insertedRi=d.rows.length-1; }
  } else {
    d.rows.push(empty); insertedRi=d.rows.length-1;
  }
  showSheet(cur);
  markPending();
  ta.scrollTop=scrollTop;
  if(insertedRi!==null){
    var newTr=document.querySelector('#ta tbody tr[data-ri="'+insertedRi+'"]');
    if(newTr){
      newTr.classList.add('sel');
      newTr.querySelectorAll('td').forEach(function(td){ td.style.minHeight='32px'; });
      newTr.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
  }
}

function delRow(){
  var selTr=document.querySelector('#ta tbody tr.sel');
  if(!selTr){alert('Επιλέξτε γραμμή πρώτα!');return;}
  var ri=parseInt(selTr.dataset.ri);
  if(isNaN(ri)) return;
  if(!confirm('Διαγραφή γραμμής;')) return;
  pushUndo();
  if(D[cur].__multi__){
    var ti=parseInt(selTr.dataset.ti);
    D[cur].tables[ti].rows.splice(ri,1);
  } else {
    var d=getCurrentData(); if(!d) return;
    d.rows.splice(ri,1);
  }
  showSheet(cur);
  markPending();
}

function addColumn(){
  var name=prompt('Όνομα νέας στήλης:');
  if(!name) return;
  pushUndo();
  if(D[cur].__multi__){
    // Βρες ποιος πίνακας είναι επιλεγμένος
    var selTh=document.querySelector('#ta thead th.col-selected');
    var ti=selTh?parseInt(selTh.closest('[data-ti]').dataset.ti):0;
    var t=D[cur].tables[ti];
    var idx=SEL_COL!==null&&SEL_COL<t.headers.length?SEL_COL+1:t.headers.length;
    t.headers.splice(idx,0,name);
    t.rows.forEach(function(r){r.splice(idx,0,'');});
  } else {
    var d=getCurrentData(); if(!d) return;
    var idx2=SEL_COL!==null&&SEL_COL<d.headers.length?SEL_COL+1:d.headers.length;
    d.headers.splice(idx2,0,name);
    d.rows.forEach(function(r){r.splice(idx2,0,'');});
  }
  SEL_COL=null;
  showSheet(cur);
  markPending();
}

function colW(h){

function thCls(h){return ECOLS.indexOf(h)>=0?' ec':PCOLS.indexOf(h)>=0?' pc':'';}
function tdCls(h,v){
  if(ECOLS.indexOf(h)>=0) return ' class="ev"';
  if(PCOLS.indexOf(h)>=0) return ' class="pv"';
  if(WCOLS.indexOf(h)>=0||String(v).length>45) return ' class="wrap"';
  return '';
}
function fmtH(h){
  var p=h.trim().split(' ');
  if(p.length<=1) return h;
  return p[0]+'<br><span style="font-weight:400;font-size:10px;opacity:.8">'+p.slice(1).join(' ')+'</span>';
}
function hl(v,q){
  if(!q||!v) return String(v||'');
  // Highlight χωρίς να χρειάζονται τόνοι
  var str=String(v);
  var norm=str.normalize('NFD').replace(/[̀-ͯ]/g,'');
  var qn=q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  var esc=qn.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  var result=''; var i=0;
  norm.replace(new RegExp(esc,'gi'),function(m,offset){
    result+=str.slice(i,offset)+'<mark>'+str.slice(offset,offset+m.length)+'</mark>';
    i=offset+m.length;
  });
  result+=str.slice(i);
  return result||str;
}

// ── RENDER ────────────────────────────────────────────────
function buildTH(headers,showSp,tableIdx){
  var s=showSp?'<th style="width:120px">Ειδικότητα<div class="resizer"></div></th>':'';
  return s+headers.map(function(h,hi){
    return '<th class="'+thCls(h).trim()+'" style="width:'+colW(h)+'px" data-hi="'+hi+'">'+fmtH(h)+'<div class="resizer"></div></th>';
  }).join('')+(EDIT_MODE?'<th class="add-col-btn" onclick="addColumn()" style="width:40px;cursor:pointer;background:#eff6ff;color:#1a56db;font-size:16px;text-align:center">+</th>':'');
}

function buildRows(headers,rows,showSp,q){
  return rows.map(function(row,ri){
    if(!Array.isArray(row)) return '';
    if(row[0]&&String(row[0]).startsWith('📌')){
      return '<tr><td colspan="'+(headers.length+(showSp?1:0))+'" style="background:#fffbeb;color:#92400e;font-size:12px;padding:6px 8px;font-style:italic;white-space:normal;word-break:break-word;">'+String(row[0]).replace('📌 ','')+'</td></tr>';
    }
    var sp=showSp?'<td><span class="spbadge">'+cur+'</span></td>':'';
    var acts='';
    var cells=row.map(function(cell,ci){
      var cls=tdCls(headers[ci],cell);
      var vs=hl(String(cell||''),q);
      var title=String(cell||'').length>35&&cls===''?' title="'+String(cell||'').replace(/"/g,'&quot;')+'"':'';
      return '<td'+cls+title+' data-ri="'+ri+'" data-ci="'+ci+'">'+vs+'</td>';
    }).join('');
    return '<tr data-ri="'+ri+'">'+acts+sp+cells+'</tr>';
  }).join('');
}

function renderTbl(headers,rows,showSp,q){
  if(!rows.length){
    document.getElementById('ta').innerHTML='<div class="state"><div class="state-icon">🔍</div><div class="state-title">Δεν βρέθηκαν αποτελέσματα</div></div>';
    return;
  }
  var html='<table><thead><tr>'+buildTH(headers,showSp)+'</tr></thead><tbody>'+buildRows(headers,rows,showSp,q)+'</tbody></table>';
  if(EDIT_MODE) html+='<button class="add-row-btn" onclick="addRow()">+ Προσθήκη γραμμής</button>';
  document.getElementById('ta').innerHTML=html;
  addResizers();
  if(EDIT_MODE) addEditListeners(headers);
}

function addEditListeners(headers){
  // Header edit
  document.querySelectorAll('thead th[data-hi]').forEach(function(th){
    th.addEventListener('click',function(e){
      if(e.detail>1) return;
      document.querySelectorAll('#ta thead th').forEach(function(t){t.classList.remove('col-selected');});
      SEL_COL=parseInt(th.dataset.hi);
      th.classList.add('col-selected');
    });
    th.addEventListener('dblclick',function(e){
      e.stopPropagation();
      var hi=parseInt(th.dataset.hi);
      var d=getCurrentData(); if(!d) return;
      makeEditable(th,function(nv){
        d.headers[hi]=nv;
        markPending();
        showSheet(cur);
      });
    });
  });
  // Cell edit
  document.querySelectorAll('tbody td[data-ri]').forEach(function(td){
    td.addEventListener('dblclick',function(e){
      var ri=parseInt(td.dataset.ri);
      var ci=parseInt(td.dataset.ci);
      var d=getCurrentData(); if(!d) return;
      makeEditable(td,function(nv){
        d.rows[ri][ci]=nv;
        markPending();
      });
    });
  });
}

function renderMulti(tables,q){
  var html='<div style="padding:8px;display:flex;flex-direction:column;gap:16px">';
  tables.forEach(function(t,ti){
    var th=buildTH(t.headers,false,ti);
    var rows=buildRowsMulti(t.headers,t.rows,q,ti);
    html+='<div data-ti="'+ti+'"><div class="tbl-title">'+t.title+'</div><table><thead><tr>'+th+'</tr></thead><tbody>'+rows+'</tbody></table>';
    if(EDIT_MODE) html+='<button class="add-row-btn" onclick="addRowMulti('+ti+')">+ Προσθήκη γραμμής</button>';
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('ta').innerHTML=html;
  addResizers();
  if(EDIT_MODE) addEditListenersMulti(tables);
}

function buildRowsMulti(headers,rows,q,ti){
  return rows.map(function(row,ri){
    if(!Array.isArray(row)) return '';
    if(row[0]&&String(row[0]).startsWith('📌')){
      return '<tr><td colspan="'+headers.length+'" style="background:#fffbeb;color:#92400e;font-size:12px;padding:6px 8px;font-style:italic;white-space:normal;word-break:break-word;">'+String(row[0]).replace('📌 ','')+'</td></tr>';
    }
    var cells=row.map(function(cell,ci){
      var cls=tdCls(headers[ci],cell);
      var vs=hl(String(cell||''),q);
      var title=String(cell||'').length>35&&cls===''?' title="'+String(cell||'').replace(/"/g,'&quot;')+'"':'';
      return '<td'+cls+title+' data-ri="'+ri+'" data-ci="'+ci+'" data-ti="'+ti+'">'+vs+'</td>';
    }).join('');
    return '<tr data-ri="'+ri+'" data-ti="'+ti+'">'+cells+'</tr>';
  }).join('');
}

function addEditListenersMulti(tables){
  // Header edit for multi
  document.querySelectorAll('[data-ti] thead th[data-hi]').forEach(function(th){
    var ti=parseInt(th.closest('[data-ti]').dataset.ti);
    th.addEventListener('click',function(e){
      if(e.detail>1) return;
      document.querySelectorAll('#ta thead th').forEach(function(t){t.classList.remove('col-selected');});
      SEL_COL=parseInt(th.dataset.hi);
      th.classList.add('col-selected');
    });
    th.addEventListener('dblclick',function(e){
      e.stopPropagation();
      var hi=parseInt(th.dataset.hi);
      pushUndo();
      makeEditable(th,function(nv){
        tables[ti].headers[hi]=nv;
        markPending();
        showSheet(cur);
      });
    });
  });
  // Cell edit for multi
  document.querySelectorAll('[data-ti] tbody td[data-ri]').forEach(function(td){
    td.addEventListener('dblclick',function(e){
      var ti=parseInt(td.dataset.ti);
      var ri=parseInt(td.dataset.ri);
      var ci=parseInt(td.dataset.ci);
      makeEditable(td,function(nv){
        tables[ti].rows[ri][ci]=nv;
        markPending();
      });
    });
  });
}

function addRowMulti(ti){
  if(!cur||!D[cur]||!D[cur].__multi__) return;
  pushUndo();
  var t=D[cur].tables[ti];
  var empty=t.headers.map(function(){return '';});
  var selTr=document.querySelector('[data-ti="'+ti+'"] tbody tr.sel');
  if(selTr){
    var ri=parseInt(selTr.dataset.ri);
    if(!isNaN(ri)) t.rows.splice(ri+1,0,empty);
    else t.rows.push(empty);
  } else t.rows.push(empty);
  showSheet(cur);
  markPending();
}

// ── INIT ──────────────────────────────────────────────────
async function init(){
  try{
    var r=await fetch('data.json'); D=await r.json();
    // Load overrides from Supabase for non-multi sheets
    var loadPromises=Object.keys(D).filter(function(k){return !D[k].__multi__;}).map(function(k){return loadSheetFromSB(k);});
    await Promise.all(loadPromises);
    var ks=Object.keys(D),total=ks.reduce(function(s,k){return s+rowCount(D[k]);},0);
    document.getElementById('badge').textContent=ks.length+' ειδικότητες · '+total+' εγγραφές';
    renderSB(); welcome();
  }catch(e){
    document.getElementById('ta').innerHTML='<div class="state"><div class="state-icon">⚠️</div><div class="state-title">'+e.message+'</div></div>';
  }
}

function goHome(){
  sMode=false; cur=null;
  document.getElementById('gS').value='';
  document.getElementById('gC').style.display='none';
  renderSB();
  welcome();
}

function welcome(){
  document.getElementById('cH').style.display='none';
  document.getElementById('ta').innerHTML='<div class="state"><div class="state-icon">🏥</div><div class="state-title">Καλώς ήρθατε στο MediPrice</div><div class="state-sub">Επιλέξτε ειδικότητα ή αναζητήστε πράξη</div></div>';
}

function renderSB(f){
  f=f||''; var el=document.getElementById('spL');
  var all=Object.keys(D);
  var keys=ORDER.filter(function(k){return all.indexOf(k)>=0&&k.toLowerCase().indexOf(f.toLowerCase())>=0;});
  all.forEach(function(k){if(ORDER.indexOf(k)<0&&k.toLowerCase().indexOf(f.toLowerCase())>=0) keys.push(k);});
  if(!keys.length){el.innerHTML='<div style="padding:12px;text-align:center;color:var(--mut);font-size:12px">Δεν βρέθηκε</div>';return;}
  el.innerHTML=keys.map(function(k){
    return '<div class="spi'+(cur===k&&!sMode?' active':'')+'" onclick="showSheet(\''+k.replace(/'/g,"\\'")+'\')">'
      +'<span class="spn">'+k+'</span><span class="spc">'+rowCount(D[k])+'</span></div>';
  }).join('');
}

function showSheet(name){
  sMode=false;
  document.getElementById('gS').value='';
  document.getElementById('gC').style.display='none';
  cur=name; renderSB(document.getElementById('spF').value);
  document.getElementById('ta').scrollTop=0;
  var d=D[name]; if(!d) return;
  document.getElementById('cH').style.display='flex';
  document.getElementById('cT').textContent=name;
  document.getElementById('cS').textContent='· '+rowCount(d)+' εγγραφές';
  if(d.__multi__) renderMulti(d.tables,'');
  else renderTbl(d.headers,d.rows,false,'');
}

function doSearch(q){
  if(!q||q.length<2) return;
  sMode=true; cur=null; renderSB(document.getElementById('spF').value);
  var normalize=function(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');};
  var ql=normalize(q), grouped={};
  Object.keys(D).forEach(function(sp){
    var d=D[sp];
    if(d.__multi__){
      d.tables.forEach(function(t){
        t.rows.forEach(function(row){
          if(!Array.isArray(row)) return;
          if(normalize(t.title).indexOf(ql)>=0||row.some(function(c){return normalize(String(c)).indexOf(ql)>=0;})){
            if(!grouped[sp]) grouped[sp]={headers:t.headers,items:[]};
            grouped[sp].items.push(row);
          }
        });
      });
    } else {
      if(!d.rows) return;
      d.rows.forEach(function(row){
        if(!Array.isArray(row)) return;
        if(row.some(function(c){return normalize(String(c)).indexOf(ql)>=0;})){
          if(!grouped[sp]) grouped[sp]={headers:d.headers,items:[]};
          grouped[sp].items.push(row);
        }
      });
    }
  });
  var total=Object.values(grouped).reduce(function(s,g){return s+g.items.length;},0);
  document.getElementById('cH').style.display='flex';
  document.getElementById('cT').textContent='"'+q+'"';
  document.getElementById('cS').textContent='· '+total+' αποτελέσματα';
  if(!total){document.getElementById('ta').innerHTML='<div class="state"><div class="state-icon">🔍</div><div class="state-title">Δεν βρέθηκαν αποτελέσματα</div></div>';return;}
  var html='<div style="padding:8px;display:flex;flex-direction:column;gap:12px">';
  Object.keys(grouped).forEach(function(sp){
    var g=grouped[sp];
    var th='<th style="width:120px;background:#eff6ff;color:var(--acc)">Ειδικότητα<div class="resizer"></div></th>'+g.headers.map(function(h){return '<th class="'+thCls(h).trim()+'" style="width:'+colW(h)+'px">'+fmtH(h)+'<div class="resizer"></div></th>';}).join('');
    var rows=g.items.map(function(row){
      var cells=row.map(function(cell,ci){var cls=tdCls(g.headers[ci],cell);return '<td'+cls+'>'+hl(String(cell||''),q)+'</td>';}).join('');
      return '<tr><td><span class="spbadge">'+sp+'</span></td>'+cells+'</tr>';
    }).join('');
    html+='<table><thead><tr>'+th+'</tr></thead><tbody>'+rows+'</tbody></table>';
  });
  html+='</div>';
  document.getElementById('ta').innerHTML=html;
  document.getElementById('ta').scrollTop=0;
  addResizers();
}

function addResizers(){
  document.querySelectorAll('thead th').forEach(function(th){
    var r=th.querySelector('.resizer'); if(!r) return;
    // Βρες το header name από το data-hi attribute
    var hi=th.dataset.hi!==undefined?parseInt(th.dataset.hi):-1;
    var sx,sw;
    r.addEventListener('mousedown',function(e){
      e.preventDefault(); sx=e.pageX; sw=th.offsetWidth;
      document.body.style.cursor='col-resize';
      function mv(e){
        var nw=Math.max(30,sw+e.pageX-sx);
        th.style.width=nw+'px';
      }
      function up(e){
        document.removeEventListener('mousemove',mv);
        document.removeEventListener('mouseup',up);
        document.body.style.cursor='';
        // Αποθήκευση width αν είμαστε σε edit mode
        if(EDIT_MODE && cur && hi>=0){
          var headers=null;
          if(D[cur]&&D[cur].__multi__){
            // Βρες ποιος πίνακας ανήκει αυτό το th
            var wrap=th.closest('[data-ti]');
            if(wrap){
              var ti=parseInt(wrap.dataset.ti);
              headers=D[cur].tables[ti].headers;
            }
          } else if(D[cur]){
            headers=D[cur].headers;
          }
          if(headers && headers[hi]!==undefined){
            if(!COL_WIDTHS[cur]) COL_WIDTHS[cur]={};
            COL_WIDTHS[cur][headers[hi]]=Math.max(30,sw+e.pageX-sx);
            markPending();
          }
        }
      }
      document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
    });
  });
}

// Row selection
document.getElementById('ta').addEventListener('click',function(e){
  if(e.target.closest('button')) return;
  var tr=e.target.closest('tbody tr'); if(!tr) return;
  var was=tr.classList.contains('sel');
  document.querySelectorAll('#ta tbody tr.sel').forEach(function(r){r.classList.remove('sel');});
  if(!was) tr.classList.add('sel');
});

// Tooltip
var tip=document.getElementById('tooltip');
document.getElementById('ta').addEventListener('mouseover',function(e){
  var td=e.target.closest('td[title]');
  if(!td){tip.style.display='none';return;}
  tip.textContent=td.getAttribute('title'); tip.style.display='block';
});
document.getElementById('ta').addEventListener('mousemove',function(e){tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';});
document.getElementById('ta').addEventListener('mouseleave',function(){tip.style.display='none';});

var st;
document.getElementById('gS').addEventListener('input',function(e){
  var q=e.target.value.trim();
  document.getElementById('gC').style.display=q?'flex':'none';
  clearTimeout(st);
  if(q.length>=2) st=setTimeout(function(){doSearch(q);},350);
  else if(!q){sMode=false;cur=null;renderSB();welcome();}
});
document.getElementById('gC').addEventListener('click',function(){
  document.getElementById('gS').value=''; document.getElementById('gC').style.display='none';
  sMode=false;cur=null;renderSB();welcome();
});
document.getElementById('spF').addEventListener('input',function(e){renderSB(e.target.value);});

init();
</script>

<script>
if (IS_MOBILE) {
  var ECOLS_M=['ΕΟΠΥΥ ΒΑ3','ΕΟΠΥΥ ΒΑ','ΕΟΠΥΥ ΒΑ3 2026','ΕΟΠΥΥ ΒΑ 2026','ΕΟΠΥΥ ΜΕ ΦΠΑ','ΕΟΠΥΥ','ΕΟΠΥΥ 2026','ΤΕΛΙΚΟΣ ΕΟΠΥΥ ΜΕ ΦΠΑ','ΕΟΠΥΥ ΚΛΙΝΙΚΗ','ΕΟΠΥΥ ΑΝΑΙΣΘ.'];
  var PCOLS_M=['ΙΔΙΩΤΗΣ ΒΑ3','ΙΔΙΩΤΗΣ ΒΑ','ΙΔΙΩΤΗΣ ΒΑ3 2026','ΙΔΙΩΤΗΣ ΒΑ 2026','ΙΔΙΩΤΗΣ ΜΕ ΦΠΑ','ΙΔΙΩΤΗΣ','ΙΔΙΩΤΗΣ 2026','ΒΑ ΜΕ ΦΠΑ','Α ΜΕ ΦΠΑ','LUX ΜΕ ΦΠΑ','SUITE ΜΕ ΦΠΑ','ΒΑ','ΙΔΙΩΤΗΣ ΚΛΙΝΙΚΗ','ΙΔΙΩΤΗΣ ΑΝΑΙΣΘ.'];
  var NAMECOLS=['ΠΕΡΙΓΡΑΦΗ ΠΡΑΞΗΣ','ΠΕΡΙΓΡΑΦΗ','ΕΙΔΟΣ ΠΡΑΞΗΣ','ΠΡΑΞΗ','ΤΙΤΛΟΣ ΕΠΕΜΒΑΣΗΣ'];

  // Φτιάχνει επίπεδη λίστα εγγραφών από τη δομή D
  function flattenData(D) {
    var rows = [];
    Object.keys(D).forEach(function(sp) {
      var d = D[sp];
      if (d.__multi__) {
        d.tables.forEach(function(t) {
          t.rows.forEach(function(row) {
            if (!Array.isArray(row)) return;
            rows.push({ sp: sp, headers: t.headers, row: row });
          });
        });
      } else if (d.rows) {
        d.rows.forEach(function(row) {
          if (!Array.isArray(row)) return;
          rows.push({ sp: sp, headers: d.headers, row: row });
        });
      }
    });
    return rows;
  }

  function getNameFromRow(headers, row) {
    for (var i = 0; i < NAMECOLS.length; i++) {
      var idx = headers.indexOf(NAMECOLS[i]);
      if (idx >= 0 && row[idx]) return String(row[idx]);
    }
    // fallback: πρώτη μακριά τιμή
    for (var j = 0; j < row.length; j++) {
      if (String(row[j]||'').length > 5) return String(row[j]);
    }
    return '—';
  }

  // Όλες οι στήλες με αριθμητική τιμή → preview chips
  // Όλες οι υπόλοιπες (με περιεχόμενο) → drawer, με αρχική σειρά
  function splitColumns(headers, row) {
    var priceCols = [], otherCols = [];
    headers.forEach(function(h, i) {
      var v = String(row[i] || '').trim();
      var n = parseFloat(v.replace(',','.'));
      var hasNumericVal = !isNaN(n) && n !== 0 && v !== '';
      var knownPrice = ECOLS_M.indexOf(h) >= 0 || PCOLS_M.indexOf(h) >= 0;
      if (hasNumericVal || knownPrice) {
        if (!hasNumericVal && v === '') return; // γνωστή τιμή αλλά κενή, skip
        var fmt = hasNumericVal ? n.toLocaleString('el-GR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' \u20ac' : (v || '\u2014');
        var cls = ECOLS_M.indexOf(h) >= 0 ? 'eoppy' : 'idiotis';
        priceCols.push({ label: h, val: fmt, cls: cls });
      } else {
        if (v !== '') otherCols.push({ label: h, val: v });
      }
    });
    return { priceCols: priceCols, otherCols: otherCols };
  }

  function normalize(s) {
    return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  }

  function renderMobileResults(allRows, sp, q) {
    var container = document.getElementById('m-results');
    var countEl = document.getElementById('m-count');

    if (!sp && !q) {
      countEl.textContent = '';
      container.innerHTML = '<div class="m-state"><div class="m-emoji">🔍</div><p>Επιλέξτε ειδικότητα<br>ή πληκτρολογήστε λέξη-κλειδί</p></div>';
      return;
    }

    var nq = normalize(q);
    var filtered = allRows.filter(function(item) {
      if (sp && item.sp !== sp) return false;
      if (nq) {
        var name = normalize(getNameFromRow(item.headers, item.row));
        var inRow = item.row.some(function(c){ return normalize(c).indexOf(nq) >= 0; });
        return name.indexOf(nq) >= 0 || inRow;
      }
      return true;
    });

    if (!filtered.length) {
      countEl.textContent = '';
      container.innerHTML = '<div class="m-state"><div class="m-emoji">😕</div><p>Δεν βρέθηκαν αποτελέσματα</p></div>';
      return;
    }

    countEl.textContent = filtered.length + ' αποτελέσματα';

    var html = filtered.map(function(item, idx) {
      var name = getNameFromRow(item.headers, item.row);
      var split = splitColumns(item.headers, item.row);

      // Price chips (preview)
      var priceHTML = split.priceCols.map(function(p) {
        return '<span class="m-price-chip ' + p.cls + '">' + p.label + ': ' + p.val + '</span>';
      }).join('');
      if (!priceHTML) priceHTML = '<span class="m-price-chip" style="opacity:.4">Τιμή N/A</span>';

      // Drawer rows (other cols)
      var drawerHTML = '';
      if (split.otherCols.length) {
        drawerHTML = '<div class="m-drawer" id="drawer-' + idx + '">'
          + split.otherCols.map(function(c) {
              return '<div class="m-drawer-row"><span class="m-drawer-label">' + c.label + '</span><span class="m-drawer-val">' + c.val + '</span></div>';
            }).join('')
          + '</div>';
      }

      var hasDrawer = split.otherCols.length > 0;
      return '<div class="m-card' + (hasDrawer ? ' m-card-expandable' : '') + '" onclick="toggleDrawer(' + idx + ', this)">'
        + '<div class="m-card-top">'
        + '<div>'
        + '<div class="m-card-sp">' + item.sp + '</div>'
        + '<div class="m-card-name">' + name + '</div>'
        + '</div>'
        + (hasDrawer ? '<span class="m-expand-icon" id="icon-' + idx + '">▼</span>' : '')
        + '</div>'
        + '<div class="m-card-prices">' + priceHTML + '</div>'
        + drawerHTML
        + '</div>';
    }).join('');

    container.innerHTML = html;
  }

  window.toggleDrawer = function(idx, card) {
    var drawer = document.getElementById('drawer-' + idx);
    var icon = document.getElementById('icon-' + idx);
    if (!drawer) return;
    var open = drawer.classList.toggle('open');
    if (icon) icon.textContent = open ? '▲' : '▼';
    card.classList.toggle('m-card-open', open);
  };

  // Αρχικοποίηση mobile — περιμένει να φορτώσει το D από το desktop init()
  function waitForData() {
    if (typeof D === 'undefined' || !Object.keys(D).length) {
      setTimeout(waitForData, 200);
      return;
    }
    var allRows = flattenData(D);
    var specialties = Object.keys(D).sort();
    var mSel = document.getElementById('m-specialty');
    specialties.forEach(function(sp) {
      var o = document.createElement('option');
      o.value = sp; o.textContent = sp;
      mSel.appendChild(o);
    });
    var total = allRows.length;
    document.getElementById('m-badge').textContent = specialties.length + ' ειδικότητες · ' + total + ' εγγραφές';

    // Αρχική κατάσταση
    document.getElementById('m-results').innerHTML = '<div class="m-state"><div class="m-emoji">🔍</div><p>Επιλέξτε ειδικότητα<br>ή πληκτρολογήστε λέξη-κλειδί</p></div>';
    document.getElementById('m-count').textContent = '';

    var mSearch = document.getElementById('m-search');
    var mSelClr = document.getElementById('m-sel-clr');
    var st;

    window.clearSpecialty = function() {
      mSel.value = '';
      mSelClr.classList.remove('visible');
      doFilter();
    };

    function doFilter() {
      var sp = mSel.value;
      var q = mSearch.value.trim();
      renderMobileResults(allRows, sp, q);
    }
    mSel.addEventListener('change', function() {
      mSelClr.classList.toggle('visible', mSel.value !== '');
      doFilter();
    });
    mSearch.addEventListener('input', function() { clearTimeout(st); st = setTimeout(doFilter, 300); });
  }

  waitForData();
}
</script>

</body>
</html>
