<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPrice — Τιμοκατάλογος Mediterraneo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg:#f5f7fa; --surface:#fff; --s2:#f0f2f5; --border:#e2e6ed;
    --accent:#1a56db; --text:#111827; --muted:#6b7280; --dim:#374151;
    --green:#059669; --amber:#d97706; --r:8px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; overflow:hidden; font-family:'Inter',sans-serif; font-size:14px; background:var(--bg); color:var(--text); }

  header { height:48px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; padding:0 16px; box-shadow:0 1px 3px rgba(0,0,0,.06); flex-shrink:0; }
  .logo { font-size:16px; font-weight:700; color:var(--accent); letter-spacing:-.3px; white-space:nowrap; }
  .logo span { font-weight:300; color:var(--muted); }
  .sep { width:1px; height:20px; background:var(--border); }
  .hosp { font-size:12px; color:var(--muted); white-space:nowrap; }
  .badge { background:var(--s2); border:1px solid var(--border); border-radius:20px; padding:2px 10px; font-size:11px; color:var(--muted); font-family:'DM Mono',monospace; white-space:nowrap; margin-left:auto; }

  .sw { position:relative; flex:1; max-width:420px; }
  .si { width:100%; background:var(--s2); border:1px solid var(--border); border-radius:var(--r); padding:6px 28px 6px 30px; color:var(--text); font-size:13px; font-family:inherit; outline:none; transition:all .2s; }
  .si:focus { border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 3px rgba(26,86,219,.1); }
  .si::placeholder { color:var(--muted); }
  .sico { position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
  .sclr { position:absolute; right:7px; top:50%; transform:translateY(-50%); background:var(--muted); color:#fff; border:none; border-radius:50%; width:16px; height:16px; font-size:9px; cursor:pointer; display:none; align-items:center; justify-content:center; line-height:1; }

  .main { display:grid; grid-template-columns:230px 1fr; height:calc(100vh - 48px); overflow:hidden; }

  .sidebar { background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .sb-head { padding:8px 12px; border-bottom:1px solid var(--border); font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; flex-shrink:0; }
  .sb-s { padding:8px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .sp-list { flex:1; overflow-y:auto; padding:4px; }
  .sp-list::-webkit-scrollbar { width:3px; }
  .sp-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  .sp-item { display:flex; align-items:center; justify-content:space-between; padding:7px 9px; border-radius:6px; cursor:pointer; transition:background .12s; gap:6px; border:1px solid transparent; }
  .sp-item:hover { background:var(--s2); }
  .sp-item.active { background:#eff6ff; border-color:#bfdbfe; }
  .sp-item.active .sp-name { color:var(--accent); font-weight:600; }
  .sp-name { font-size:12px; font-weight:500; color:var(--dim); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sp-cnt { font-size:10px; font-family:'DM Mono',monospace; color:var(--muted); background:var(--s2); padding:1px 5px; border-radius:8px; flex-shrink:0; }
  .sp-item.active .sp-cnt { background:#dbeafe; color:var(--accent); }

  .content { display:flex; flex-direction:column; overflow:hidden; }
  .ch { padding:8px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; background:var(--surface); flex-shrink:0; min-height:44px; }
  .ct { font-size:14px; font-weight:600; white-space:nowrap; }
  .cs { font-size:12px; color:var(--muted); }

  #ta { flex:1; overflow:auto; }
  #ta::-webkit-scrollbar { width:5px; height:5px; }
  #ta::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

  table { border-collapse:collapse; font-size:12.5px; background:var(--surface); min-width:100%; }
  thead { position:sticky; top:0; z-index:10; }
  th { background:#f8fafc; color:var(--muted); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; padding:8px 10px; text-align:left; border-bottom:2px solid var(--border); white-space:nowrap; border-right:1px solid var(--border); }
  th:last-child { border-right:none; }
  td { padding:7px 10px; border-bottom:1px solid #f1f5f9; vertical-align:top; border-right:1px solid #f5f7fa; white-space:nowrap; max-width:320px; overflow:hidden; text-overflow:ellipsis; }
  td.wrap { white-space:normal; word-break:break-word; }
  td:last-child { border-right:none; }
  tr:hover td { background:#f8faff; }

  .sp-badge { font-size:10.5px; font-weight:600; color:var(--accent); background:#eff6ff; border-radius:4px; padding:2px 6px; white-space:nowrap; }
  mark { background:#fef08a; color:#713f12; border-radius:2px; padding:0 1px; }

  .state { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:80px 40px; height:100%; background:var(--surface); color:var(--muted); }
  .state-icon { font-size:40px; opacity:.2; }
  .state-title { font-size:15px; font-weight:600; color:var(--dim); }
  .state-sub { font-size:13px; text-align:center; max-width:300px; line-height:1.6; }
  .spin { width:24px; height:24px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:sp .8s linear infinite; margin:0 auto; }
  @keyframes sp { to { transform:rotate(360deg); } }

  .load-bar { position:fixed; top:48px; left:230px; right:0; height:3px; background:var(--border); z-index:200; }
  .load-fill { height:100%; background:var(--accent); width:0; transition:width .3s; border-radius:0 2px 2px 0; }
</style>
</head>
<body>

<header>
  <div class="logo">Medi<span>Price</span></div>
  <div class="sep"></div>
  <div class="hosp">Τιμοκατάλογος Mediterraneo Hospital</div>
  <div class="sw">
    <svg class="sico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input class="si" id="gSearch" placeholder="Αναζήτηση πράξης σε όλες τις ειδικότητες..." type="text">
    <button class="sclr" id="gClr">✕</button>
  </div>
  <div class="badge" id="totalBadge">Φόρτωση...</div>
</header>

<div class="load-bar"><div class="load-fill" id="loadFill"></div></div>

<div class="main">
  <div class="sidebar">
    <div class="sb-head">🏥 Ειδικότητες</div>
    <div class="sb-s">
      <div class="sw">
        <svg class="sico" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="si" id="spSearch" placeholder="Φιλτράρισμα..." type="text">
      </div>
    </div>
    <div class="sp-list" id="spList"><div style="padding:20px;text-align:center"><div class="spin"></div></div></div>
  </div>

  <div class="content">
    <div class="ch" id="cHeader" style="display:none">
      <span class="ct" id="cTitle"></span>
      <span class="cs" id="cSub"></span>
    </div>
    <div id="ta">
      <div class="state">
        <div class="state-icon">🏥</div>
        <div class="state-title">Καλώς ήρθατε στο MediPrice</div>
        <div class="state-sub">Φόρτωση τιμοκαταλόγου...</div>
      </div>
    </div>
  </div>
</div>

<script>
const EXCEL_URL = 'ΤΙΜΟΚΑΤΑΛΟΓΟΣ 25-05-2026.xlsx';

let workbook = null;
let curSheet = null;
let allData = {}; // { sheetName: { headers: [], rows: [[...]] } }

// Φόρτωση Excel
async function loadExcel() {
  try {
    setLoad(20);
    const resp = await fetch(EXCEL_URL);
    setLoad(50);
    const ab = await resp.arrayBuffer();
    setLoad(70);
    workbook = XLSX.read(ab, { type: 'array', cellDates: true });
    setLoad(90);
    parseAllSheets();
    setLoad(100);
    setTimeout(() => document.getElementById('loadFill').style.width = '0', 500);
    renderSidebar();
    document.getElementById('totalBadge').textContent = `${workbook.SheetNames.length} ειδικότητες`;
    document.getElementById('ta').innerHTML = `<div class="state">
      <div class="state-icon">🏥</div>
      <div class="state-title">Καλώς ήρθατε στο MediPrice</div>
      <div class="state-sub">Επιλέξτε ειδικότητα ή αναζητήστε πράξη</div>
    </div>`;
  } catch(e) {
    document.getElementById('ta').innerHTML = `<div class="state">
      <div class="state-icon">⚠️</div>
      <div class="state-title">Σφάλμα φόρτωσης</div>
      <div class="state-sub">${e.message}</div>
    </div>`;
  }
}

function setLoad(pct) {
  document.getElementById('loadFill').style.width = pct + '%';
}

function parseAllSheets() {
  workbook.SheetNames.forEach(name => {
    const ws = workbook.Sheets[name];
    const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

    // Βρες την πρώτη γραμμή με περιεχόμενο (header)
    let headerRow = 0;
    for (let i = 0; i < Math.min(raw.length, 6); i++) {
      const nonEmpty = raw[i].filter(c => c !== '').length;
      if (nonEmpty >= 2) { headerRow = i; break; }
    }

    // Βρες το πλάτος (πόσες στήλες)
    let maxCols = 0;
    raw.forEach(r => { if (r.length > maxCols) maxCols = r.length; });

    // Headers: συνδυασμός 1ης και 2ης header γραμμής (για merged cells)
    const h1 = raw[headerRow] || [];
    const h2 = raw[headerRow + 1] || [];

    // Αν η 2η γραμμή έχει περισσότερα στοιχεία, είναι sub-header
    const h2HasData = h2.filter(c => c !== '' && isNaN(c)).length > 2;

    let headers = [];
    for (let c = 0; c < maxCols; c++) {
      const top = String(h1[c] || '').trim();
      const sub = h2HasData ? String(h2[c] || '').trim() : '';
      if (top && sub) headers.push(`${top}\n${sub}`);
      else if (top) headers.push(top);
      else if (sub) headers.push(sub);
      else headers.push('');
    }

    // Δεδομένα: όλες οι γραμμές μετά τον header
    const dataStart = h2HasData ? headerRow + 2 : headerRow + 1;
    const rows = raw.slice(dataStart).filter(r => r.some(c => c !== ''));

    allData[name] = { headers, rows };
  });
}

function renderSidebar(f = '') {
  const el = document.getElementById('spList');
  if (!workbook) return;
  const names = workbook.SheetNames.filter(n => n.toLowerCase().includes(f.toLowerCase()));
  el.innerHTML = names.map(n => `
    <div class="sp-item ${curSheet === n ? 'active' : ''}" onclick="showSheet('${n.replace(/'/g,"\\'")}')">
      <span class="sp-name">${n.trim()}</span>
      <span class="sp-cnt">${allData[n]?.rows.length || 0}</span>
    </div>`).join('');
}

function showSheet(name) {
  curSheet = name;
  document.getElementById('gSearch').value = '';
  document.getElementById('gClr').style.display = 'none';
  renderSidebar(document.getElementById('spSearch').value);
  const d = allData[name];
  if (!d) return;
  document.getElementById('cHeader').style.display = 'flex';
  document.getElementById('cTitle').textContent = name.trim();
  document.getElementById('cSub').textContent = `· ${d.rows.length} εγγραφές`;
  renderTable(d.headers, d.rows, '');
}

function renderTable(headers, rows, query) {
  if (!rows.length) {
    document.getElementById('ta').innerHTML = '<div class="state"><div class="state-icon">🔍</div><div class="state-title">Δεν βρέθηκαν αποτελέσματα</div></div>';
    return;
  }

  const thHtml = headers.map(h => {
    const label = String(h).replace(/\n/g, '<br>');
    return `<th>${label}</th>`;
  }).join('');

  const rowsHtml = rows.map(row => {
    const cells = headers.map((_, ci) => {
      let val = String(row[ci] ?? '');
      if (query && val.toLowerCase().includes(query.toLowerCase())) {
        val = val.replace(new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'), m => `<mark>${m}</mark>`);
      }
      // Μεγάλο κείμενο = wrap
      const isLong = String(row[ci] ?? '').length > 40;
      return `<td ${isLong ? 'class="wrap"' : ''}>${val}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');

  document.getElementById('ta').innerHTML = `
    <table>
      <thead><tr>${thHtml}</tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
}

function doGlobalSearch(query) {
  if (!query || query.length < 2) return;
  document.getElementById('cHeader').style.display = 'flex';
  document.getElementById('cTitle').textContent = `"${query}"`;
  curSheet = null;
  renderSidebar(document.getElementById('spSearch').value);

  // Αναζήτηση σε όλα τα sheets
  const results = [];
  workbook.SheetNames.forEach(name => {
    const d = allData[name];
    if (!d) return;
    d.rows.forEach(row => {
      if (row.some(cell => String(cell).toLowerCase().includes(query.toLowerCase()))) {
        results.push({ sheet: name, row, headers: d.headers });
      }
    });
  });

  document.getElementById('cSub').textContent = `· ${results.length} αποτελέσματα`;

  if (!results.length) {
    document.getElementById('ta').innerHTML = '<div class="state"><div class="state-icon">🔍</div><div class="state-title">Δεν βρέθηκαν αποτελέσματα</div></div>';
    return;
  }

  // Εμφάνιση με ειδικότητα + τιμές
  const rowsHtml = results.map(({ sheet, row }) => {
    const cells = row.map(cell => {
      let val = String(cell ?? '');
      if (query && val.toLowerCase().includes(query.toLowerCase())) {
        val = val.replace(new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'), m => `<mark>${m}</mark>`);
      }
      const isLong = String(cell ?? '').length > 40;
      return `<td ${isLong ? 'class="wrap"' : ''}>${val}</td>`;
    }).join('');
    return `<tr><td><span class="sp-badge">${sheet.trim()}</span></td>${cells}</tr>`;
  }).join('');

  document.getElementById('ta').innerHTML = `
    <table>
      <thead><tr><th>Ειδικότητα</th><th colspan="20">Δεδομένα</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
}

// Events
let t;
document.getElementById('gSearch').addEventListener('input', e => {
  const q = e.target.value.trim();
  document.getElementById('gClr').style.display = q ? 'flex' : 'none';
  clearTimeout(t);
  if (q.length >= 2) t = setTimeout(() => doGlobalSearch(q), 350);
  else if (!q) {
    curSheet = null;
    renderSidebar();
    document.getElementById('cHeader').style.display = 'none';
    document.getElementById('ta').innerHTML = `<div class="state">
      <div class="state-icon">🏥</div>
      <div class="state-title">Καλώς ήρθατε στο MediPrice</div>
      <div class="state-sub">Επιλέξτε ειδικότητα ή αναζητήστε πράξη</div>
    </div>`;
  }
});

document.getElementById('gClr').addEventListener('click', () => {
  document.getElementById('gSearch').value = '';
  document.getElementById('gClr').style.display = 'none';
  curSheet = null; renderSidebar();
  document.getElementById('cHeader').style.display = 'none';
  document.getElementById('ta').innerHTML = `<div class="state">
    <div class="state-icon">🏥</div>
    <div class="state-title">Καλώς ήρθατε στο MediPrice</div>
    <div class="state-sub">Επιλέξτε ειδικότητα ή αναζητήστε πράξη</div>
  </div>`;
});

document.getElementById('spSearch').addEventListener('input', e => renderSidebar(e.target.value));

loadExcel();
</script>
</body>
</html>
