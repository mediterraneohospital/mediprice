<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediPrice — Τιμοκατάλογος Mediterraneo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
  :root{--bg:#f5f7fa;--surface:#fff;--s2:#f0f2f5;--border:#e2e6ed;--accent:#1a56db;--text:#111827;--muted:#6b7280;--dim:#374151;--r:8px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;font-size:13px;background:var(--bg);color:var(--text);}

  header{height:48px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);flex-shrink:0;}
  .logo{font-size:16px;letter-spacing:-.3px;white-space:nowrap;}
  .logo .medi{font-weight:700;color:#1a56db;}
  .logo .price{font-weight:700;color:#e53e3e;}
  .sep{width:1px;height:20px;background:var(--border);}
  .hosp{font-size:12px;color:var(--muted);white-space:nowrap;}
  .badge{background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:2px 10px;font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;white-space:nowrap;margin-left:auto;}

  .sw{position:relative;flex:1;max-width:420px;}
  .si{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:6px 28px 6px 30px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:all .2s;}
  .si:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(26,86,219,.1);}
  .si::placeholder{color:var(--muted);}
  .sico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
  .sclr{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:var(--muted);color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:9px;cursor:pointer;display:none;align-items:center;justify-content:center;}

  .main{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 48px);overflow:hidden;}
  .sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  .sb-head{padding:8px 12px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;flex-shrink:0;}
  .sb-s{padding:8px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .sp-list{flex:1;overflow-y:auto;padding:4px;}
  .sp-list::-webkit-scrollbar{width:3px;}
  .sp-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  .sp-item{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:6px;cursor:pointer;transition:background .12s;gap:6px;border:1px solid transparent;}
  .sp-item:hover{background:var(--s2);}
  .sp-item.active{background:#eff6ff;border-color:#bfdbfe;}
  .sp-item.active .sp-name{color:var(--accent);font-weight:600;}
  .sp-name{font-size:12px;font-weight:500;color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sp-cnt{font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);background:var(--s2);padding:1px 5px;border-radius:8px;flex-shrink:0;}
  .sp-item.active .sp-cnt{background:#dbeafe;color:var(--accent);}

  .content{display:flex;flex-direction:column;overflow:hidden;}
  .ch{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface);flex-shrink:0;min-height:42px;}
  .ct{font-size:14px;font-weight:600;white-space:nowrap;}
  .cs{font-size:12px;color:var(--muted);}

  #ta{flex:1;overflow:auto;scroll-behavior:smooth;}
  #ta::-webkit-scrollbar{width:5px;height:5px;}
  #ta::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  table{border-collapse:collapse;font-size:13px;background:var(--surface);table-layout:fixed;width:max-content;min-width:100%;}
  thead{position:sticky;top:0;z-index:10;}
  th{background:#eef1f6;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px;padding:6px 8px;text-align:left;border-bottom:2px solid var(--border);border-right:1px solid var(--border);white-space:normal;word-break:break-word;vertical-align:top;position:relative;min-width:60px;}
  th:last-child{border-right:none;}
  .resizer{position:absolute;right:0;top:0;width:6px;height:100%;cursor:col-resize;user-select:none;z-index:2;background:transparent;}
  .resizer:hover{background:rgba(26,86,219,.35);}
  td{padding:5px 8px;border-bottom:1px solid #f1f5f9;border-right:1px solid #eef0f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
  td.wrap{white-space:normal;word-break:break-word;line-height:1.4;}
  td.num{text-align:right;font-family:'DM Mono',monospace;font-size:12px;}
  td:last-child{border-right:none;}
  tbody tr:nth-child(even) td{background:#f7f9fc;}
  tbody tr:hover td{background:#eef4ff!important;cursor:pointer;}
  tbody tr.selected td{background:#dbeafe!important;outline:1px solid #93c5fd;}

  .sp-badge{font-size:10px;font-weight:600;color:var(--accent);background:#eff6ff;border-radius:4px;padding:2px 5px;white-space:nowrap;}
  th.price-col{background:#f0fdf4;color:#166534;}
  td.price-val{background:#f0fdf4;font-weight:600;color:#166534;text-align:right;font-family:"DM Mono",monospace;font-size:12px;}
  th.price-col-p{background:#eff6ff;color:#1e40af;}
  td.price-val-p{background:#eff6ff;font-weight:600;color:#1e40af;text-align:right;font-family:"DM Mono",monospace;font-size:12px;}
  mark{background:#fef08a;color:#713f12;border-radius:2px;padding:0 1px;}
  td[title]{cursor:default;}
  td[title]:hover::after{content:attr(title);position:fixed;background:#1f2937;color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;max-width:320px;white-space:normal;word-break:break-word;z-index:999;pointer-events:none;line-height:1.5;box-shadow:0 4px 12px rgba(0,0,0,.2);}
  .state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:80px 40px;height:100%;background:var(--surface);color:var(--muted);}
  .state-icon{font-size:40px;opacity:.2;}
  .state-title{font-size:15px;font-weight:600;color:var(--dim);}
  .state-sub{font-size:13px;text-align:center;max-width:300px;line-height:1.6;}
  .spin{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="medi">Medi</span><span class="price">Price</span></div>
  <div class="sep"></div>
  <div class="hosp">Τιμοκατάλογος Mediterraneo Hospital</div>
  <div class="sw">
    <svg class="sico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input class="si" id="gSearch" placeholder="Αναζήτηση πράξης σε όλες τις ειδικότητες..." type="text">
    <button class="sclr" id="gClr">✕</button>
  </div>
  <div class="badge" id="totalBadge">Φόρτωση...</div>
</header>
<div class="main">
  <div class="sidebar">
    <div class="sb-head">🏥 Ειδικότητες</div>
    <div class="sb-s">
      <div class="sw">
        <svg class="sico" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="si" id="spSearch" placeholder="Φιλτράρισμα..." type="text">
      </div>
    </div>
    <div class="sp-list" id="spList"><div style="padding:20px;text-align:center"><div class="spin"></div></div></div>
  </div>
  <div class="content">
    <div class="ch" id="cHeader" style="display:none">
      <span class="ct" id="cTitle"></span>
      <span class="cs" id="cSub"></span>
    </div>
    <div id="ta"><div class="state"><div class="state-icon">🏥</div><div class="state-title">Φόρτωση...</div></div></div>
  </div>
</div>
<script>
var DATA={}, curSheet=null, searchMode=false;

// Στήλες με wrap
var WRAP=['ΠΕΡΙΓΡΑΦΗ ΠΡΑΞΗΣ','ΕΙΔΟΣ ΠΡΑΞΗΣ','ΠΡΑΞΗ','ΤΙΤΛΟΣ ΕΠΕΜΒΑΣΗΣ','ΠΕΡΙΓΡΑΦΗ',
  'ΠΑΡΑΤΗΡΗΣΕΙΣ','ΣΧΟΛΙΑ','EXTRA','ΥΛΙΚΑ ΙΔΙΩΤΗ','ΑΠΟΦΑΣΗ ΚΕΣΥ','ΕΞΕΤΑΣΕΙΣ ΠΑΚΕΤΟΥ',
  'ΠΑΡΑΤΗΡΗΣΕΙΣ - ΠΑΡΑΔΟΧΕΣ','ΥΛΙΚΑ MEDTRONIC','ΥΛΙΚΟ'];

// Στήλες με αριθμούς
var NUM=['ΙΔΙΩΤΗΣ ΒΑ3','ΙΔΙΩΤΗΣ ΒΑ','ΕΟΠΥΥ ΒΑ3','ΕΟΠΥΥ ΒΑ','ΙΔΙΩΤΗΣ ΒΑ3 2026','ΙΔΙΩΤΗΣ ΒΑ 2026',
  'ΕΟΠΥΥ ΒΑ3 2026','ΕΟΠΥΥ ΒΑ 2026','ΙΔΙΩΤΗΣ','ΕΟΠΥΥ','ΙΔΙΩΤΗΣ ΜΕ ΦΠΑ','ΕΟΠΥΥ ΜΕ ΦΠΑ',
  'ΙΔΙΩΤΗΣ ΒΑ ΜΕ ΦΠΑ','ΕΟΠΥΥ ΒΑ ΜΕ ΦΠΑ','ΙΔΙΩΤΗΣ ΜΕ ΦΠΑ 24%','ΕΟΠΥΥ ΜΕ ΦΠΑ 24%',
  'ODC ΙΔΙΩΤΗΣ ΠΡΟ ΦΠΑ','ODC ΙΔΙΩΤΗΣ ΜΕ ΦΠΑ','ODC ΕΟΠΥΥ ΠΡΟ ΦΠΑ','ODC ΕΟΠΥΥ ΜΕ ΦΠΑ',
  'ΒΑ ΙΔΙΩΤΗΣ ΠΡΟ ΦΠΑ','ΒΑ ΙΔΙΩΤΗΣ ΜΕ ΦΠΑ','ΒΑ ΕΟΠΥΥ ΠΡΟ ΦΠΑ','ΒΑ ΕΟΠΥΥ ΜΕ ΦΠΑ',
  'ΕΟΠΥΥ Α','ΙΔΙΩΤΗΣ Α','ΤΕΛΙΚΟΣ ΕΟΠΥΥ ΜΕ ΦΠΑ','ΚΟΣΤΟΣ ΥΛΙΚΟΥ ΧΩΡΙΣ ΦΠΑ',
  'ΙΔΙΩΤΗΣ 2026','ΕΟΠΥΥ 2026','ΒΑ','ODC','Α','LUX','SUITE',
  'ODC ΜΕ ΦΠΑ','ΒΑ ΜΕ ΦΠΑ','Α ΜΕ ΦΠΑ','LUX ΜΕ ΦΠΑ','SUITE ΜΕ ΦΠΑ'];

// Στήλες με μικρό default πλάτος
var NARROW=['ΚΕΝ','ΗΜ','ΗΜ. ΝΟΣ','HM','Α/Α','ΝΟΣΗΛΕΙΑ ΚΛΙΝΗ ΘΑΛΑΜΟΥ','ΝΟΣΗΛΕΙΑ ΜΑΠ/ΜΕΘ','ΜΕΘ','ΠΑΡΑΜΟΝΗ','ΗΜΕΡΕΣ ΝΟΣΗΛΕΙΑΣ','ΗΜΕΡΕΣ','ODC'];

async function init(){
  try{
    var r=await fetch('data.json'); DATA=await r.json();
    var sheets=Object.keys(DATA);
    var total=sheets.reduce(function(s,k){return s+DATA[k].rows.length;},0);
    document.getElementById('totalBadge').textContent=sheets.length+' ειδικότητες · '+total+' εγγραφές';
    renderSidebar(); welcome();
  }catch(e){
    document.getElementById('ta').innerHTML='<div class="state"><div class="state-icon">⚠️</div><div class="state-title">Σφάλμα: '+e.message+'</div></div>';
  }
}

function welcome(){
  document.getElementById('cHeader').style.display='none';
  document.getElementById('ta').innerHTML='<div class="state"><div class="state-icon">🏥</div><div class="state-title">Καλώς ήρθατε στο MediPrice</div><div class="state-sub">Επιλέξτε ειδικότητα ή αναζητήστε πράξη</div></div>';
}

function renderSidebar(f){
  f=f||''; var el=document.getElementById('spList');
  var keys=Object.keys(DATA).filter(function(k){return k.toLowerCase().indexOf(f.toLowerCase())>=0;});
  if(!keys.length){el.innerHTML='<div style="padding:12px;text-align:center;color:var(--muted);font-size:12px">Δεν βρέθηκε</div>';return;}
  el.innerHTML=keys.map(function(k){
    return '<div class="sp-item'+(curSheet===k&&!searchMode?' active':'')+'" onclick="showSheet(\''+k.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')">' +
      '<span class="sp-name">'+k+'</span><span class="sp-cnt">'+DATA[k].rows.length+'</span></div>';
  }).join('');
}

function showSheet(name){
  searchMode=false;
  document.getElementById('gSearch').value='';
  document.getElementById('gClr').style.display='none';
  curSheet=name;
  renderSidebar(document.getElementById('spSearch').value);
  document.getElementById('ta').scrollTop=0;
  var d=DATA[name];
  if(!d) return;
  document.getElementById('cHeader').style.display='flex';
  document.getElementById('cTitle').textContent=name;
  document.getElementById('cSub').textContent='· '+d.rows.length+' εγγραφές';
  renderTable(d.headers, d.rows.map(function(r){return {row:r};}), '');
}

function hl(v,q){
  if(!q||!v) return v||'';
  return String(v).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),function(m){return '<mark>'+m+'</mark>';});
}

var EOPYY_COLS=['ΕΟΠΥΥ ΒΑ3','ΕΟΠΥΥ ΒΑ','ΕΟΠΥΥ ΒΑ3 2026','ΕΟΠΥΥ ΒΑ 2026','ΕΟΠΥΥ ΜΕ ΦΠΑ',
  'ΕΟΠΥΥ ΜΕ ΦΠΑ 24%','ΕΟΠΥΥ ΒΑ ΜΕ ΦΠΑ','ODC ΕΟΠΥΥ ΠΡΟ ΦΠΑ','ODC ΕΟΠΥΥ ΜΕ ΦΠΑ',
  'ΒΑ ΕΟΠΥΥ ΠΡΟ ΦΠΑ','ΒΑ ΕΟΠΥΥ ΜΕ ΦΠΑ','ΕΟΠΥΥ Α','ΤΕΛΙΚΟΣ ΕΟΠΥΥ ΜΕ ΦΠΑ','ΕΟΠΥΥ',
  'ΕΟΠΥΥ 2026','ΒΑ NET','Α NET','LUX NET','SUITE NET'];
var PRIV_COLS=['ΙΔΙΩΤΗΣ ΒΑ3','ΙΔΙΩΤΗΣ ΒΑ','ΙΔΙΩΤΗΣ ΒΑ3 2026','ΙΔΙΩΤΗΣ ΒΑ 2026','ΙΔΙΩΤΗΣ ΜΕ ΦΠΑ',
  'ΙΔΙΩΤΗΣ ΜΕ ΦΠΑ 24%','ΙΔΙΩΤΗΣ ΒΑ ΜΕ ΦΠΑ','ODC ΙΔΙΩΤΗΣ ΠΡΟ ΦΠΑ','ODC ΙΔΙΩΤΗΣ ΜΕ ΦΠΑ',
  'ΒΑ ΙΔΙΩΤΗΣ ΠΡΟ ΦΠΑ','ΒΑ ΙΔΙΩΤΗΣ ΜΕ ΦΠΑ','ΙΔΙΩΤΗΣ Α','ΙΔΙΩΤΗΣ',
  'ΙΔΙΩΤΗΣ 2026','ΒΑ ΜΕ ΦΠΑ','Α ΜΕ ΦΠΑ','LUX ΜΕ ΦΠΑ','SUITE ΜΕ ΦΠΑ','ODC ΜΕ ΦΠΑ',
  'ΒΑ','Α','LUX','SUITE','ODC'];

function fmtHeader(h){
  var parts=h.trim().split(' ');
  if(parts.length<=1) return h;
  return parts[0]+'<br><span style="font-weight:500;font-size:10px;opacity:.85">'+parts.slice(1).join(' ')+'</span>';
}
function thCls(h){
  if(EOPYY_COLS.indexOf(h)>=0) return ' class="price-col"';
  if(PRIV_COLS.indexOf(h)>=0) return ' class="price-col-p"';
  return '';
}
function colWidth(h){
  if(h==='ΚΕΝ'||h==='ΚΕΝ/Π.Δ.'||h==='ΚΕΝ (2)') return ' style="width:45px;min-width:45px"';
  if(NARROW.indexOf(h)>=0) return ' style="width:60px"';
  if(EOPYY_COLS.indexOf(h)>=0||PRIV_COLS.indexOf(h)>=0) return ' style="width:80px"';
  if(WRAP.indexOf(h)>=0) return ' style="width:190px"';
  return ' style="width:100px"';
}
function tdClass(h,val){
  if(EOPYY_COLS.indexOf(h)>=0) return ' class="price-val"';
  if(PRIV_COLS.indexOf(h)>=0) return ' class="price-val-p"';
  if(h==='ΚΕΝ'||h==='ΚΕΝ/Π.Δ.'||h==='ΚΕΝ (2)') return ' class="wrap" style="width:45px;min-width:45px;max-width:45px"';
  if(WRAP.indexOf(h)>=0||String(val).length>45) return ' class="wrap"';
  return '';
}

function renderTable(headers, items, query){
  if(!items.length){
    document.getElementById('ta').innerHTML='<div class="state"><div class="state-icon">🔍</div><div class="state-title">Δεν βρέθηκαν αποτελέσματα</div></div>';
    return;
  }
  var spCol=items[0].sp?'<th style="width:120px">Ειδικότητα<div class="resizer"></div></th>':'';
  var thHtml=spCol+headers.map(function(h){
    return '<th'+thCls(h)+colWidth(h)+'>'+fmtHeader(h)+'<div class="resizer"></div></th>';
  }).join('');
  var rowsHtml=items.map(function(item){
    var spTd=item.sp?'<td><span class="sp-badge">'+item.sp+'</span></td>':'';
    var cells=item.row.map(function(cell,ci){
      var cls=tdClass(headers[ci],cell);
      var cellStr=String(cell||'');
      var titleAttr=(cellStr.length>30&&WRAP.indexOf(headers[ci])<0&&EOPYY_COLS.indexOf(headers[ci])<0&&PRIV_COLS.indexOf(headers[ci])<0)?' title="'+cellStr.replace(/"/g,'&quot;')+'"':'';
      return '<td'+cls+titleAttr+'>'+hl(cellStr,query)+'</td>';
    }).join('');
    return '<tr>'+spTd+cells+'</tr>';
  }).join('');
  document.getElementById('ta').innerHTML='<table><thead><tr>'+thHtml+'</tr></thead><tbody>'+rowsHtml+'</tbody></table>';
  addResizers();
}

function addResizers(){
  document.querySelectorAll('thead th').forEach(function(th){
    var r=th.querySelector('.resizer');
    if(!r) return;
    var startX, startW;
    r.addEventListener('mousedown',function(e){
      e.preventDefault();
      startX=e.pageX; startW=th.offsetWidth;
      document.body.style.cursor='col-resize';
      r.style.background='rgba(26,86,219,.5)';
      function onMove(e){
        var w=Math.max(40, startW+e.pageX-startX);
        th.style.width=w+'px';
      }
      function onUp(){
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
        document.body.style.cursor='';
        r.style.background='';
      }
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    });
  });
}

// Click για επιλογή γραμμής
document.getElementById('ta').addEventListener('click',function(e){
  var tr=e.target.closest('tbody tr');
  if(!tr) return;
  var was=tr.classList.contains('selected');
  document.querySelectorAll('#ta tbody tr.selected').forEach(function(r){r.classList.remove('selected');});
  if(!was) tr.classList.add('selected');
});

function doSearch(query){
  if(!query||query.length<2) return;
  searchMode=true; curSheet=null;
  renderSidebar(document.getElementById('spSearch').value);
  var q=query.toLowerCase(), grouped={};
  Object.keys(DATA).forEach(function(sp){
    var d=DATA[sp];
    d.rows.forEach(function(row){
      if(row.some(function(c){return String(c).toLowerCase().indexOf(q)>=0;})){
        if(!grouped[sp]) grouped[sp]={headers:d.headers,items:[]};
        grouped[sp].items.push({sp:sp,row:row});
      }
    });
  });
  var total=Object.values(grouped).reduce(function(s,g){return s+g.items.length;},0);
  document.getElementById('cHeader').style.display='flex';
  document.getElementById('cTitle').textContent='"'+query+'"';
  document.getElementById('cSub').textContent='· '+total+' αποτελέσματα';
  if(!total){
    document.getElementById('ta').innerHTML='<div class="state"><div class="state-icon">🔍</div><div class="state-title">Δεν βρέθηκαν αποτελέσματα</div></div>';
    return;
  }
  var html='<div style="padding:8px;display:flex;flex-direction:column;gap:12px">';
  Object.keys(grouped).forEach(function(sp){
    var g=grouped[sp];
    var spTh='<th style="width:120px;background:#eff6ff;color:var(--accent)">Ειδικότητα<div class="resizer"></div></th>';
    var thHtml=spTh+g.headers.map(function(h){return '<th'+thCls(h)+colWidth(h)+'>'+fmtHeader(h)+'<div class="resizer"></div></th>';}).join('');
    var rowsHtml=g.items.map(function(item){
      var spTd='<td><span class="sp-badge">'+sp+'</span></td>';
      var cells=item.row.map(function(cell,ci){
        var cls=tdClass(g.headers[ci],cell);
        return '<td'+cls+'>'+hl(String(cell||''),query)+'</td>';
      }).join('');
      return '<tr>'+spTd+cells+'</tr>';
    }).join('');
    html+='<table><thead><tr>'+thHtml+'</tr></thead><tbody>'+rowsHtml+'</tbody></table>';
  });
  html+='</div>';
  document.getElementById('ta').innerHTML=html;
  document.getElementById('ta').scrollTop=0;
  addResizers();
}

var st;
document.getElementById('gSearch').addEventListener('input',function(e){
  var q=e.target.value.trim();
  document.getElementById('gClr').style.display=q?'flex':'none';
  clearTimeout(st);
  if(q.length>=2) st=setTimeout(function(){doSearch(q);},350);
  else if(!q){searchMode=false;curSheet=null;renderSidebar();welcome();}
});
document.getElementById('gClr').addEventListener('click',function(){
  document.getElementById('gSearch').value='';
  document.getElementById('gClr').style.display='none';
  searchMode=false;curSheet=null;renderSidebar();welcome();
});
document.getElementById('spSearch').addEventListener('input',function(e){renderSidebar(e.target.value);});
init();
</script>
</body>
