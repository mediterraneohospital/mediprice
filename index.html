<script>

function pushUndo(){
  if(!cur||!D[cur]||D[cur].__multi__) return;
  var d=D[cur];
  UNDO_STACK.push({sheet:cur,headers:JSON.parse(JSON.stringify(d.headers)),rows:JSON.parse(JSON.stringify(d.rows))});
  if(UNDO_STACK.length>20) UNDO_STACK.shift();
  document.getElementById('undoBtn').disabled=false;
}

function undo(){
  if(!UNDO_STACK.length) return;
  var state=UNDO_STACK.pop();
  if(D[state.sheet]){
    D[state.sheet].headers=state.headers;
    D[state.sheet].rows=state.rows;
    if(cur===state.sheet) showSheet(cur);
    markPending();
  }
  if(!UNDO_STACK.length) document.getElementById('undoBtn').disabled=true;
}

var ORDER=['ΑΓΓΕΙΟΧΕΙΡΟΥΡΓΙΚΗ','ΓΑΣΤΡΕΝΤΕΡΟΛΟΓΙΚΑ','ΓΝΑΘΟΧΕΙΡΟΥΡΓΙΚΑ','ΓΕΝΙΚΗ ΧΕΙΡΟΥΡΓΙΚΗ','ΓΥΝΑΙΚΟΛΟΓΙΚΗ','ΕΠΕΜΒΑΤΙΚΗ ΑΚΤΙΝΟΛΟΓΙΑ','ΕΠΕΜΒΑΤΙΚΗ ΚΑΡΔΙΟΛΟΓΙΑ','ΗΛΕΚΤΡΟΦΥΣΙΟΛΟΓΙΑ','ΘΕΡΑΠΕΙΕΣ ΠΟΝΟ ΜΕ ΣΥΣΚΕΥΕΣ','INTERSTIM','ΘΩΡΑΚΟΧΕΙΡΟΥΡΓΙΚΗ','ΚΑΡΔΙΟΧΕΙΡΟΥΡΓΙΚΗ','ΜΟΝΑΔΑ ΜΑΣΤΟΥ','ΝΕΥΡΟΧΕΙΡΟΥΡΓΙΚΗ','ΟΝΠ','ΟΡΘΟΠΕΔΙΚΗ','ΟΥΡΟΛΟΓΙΚΗ','ΟΦΘΑΛΜΟΛΟΓΙΑ','ΠΛΑΣΤΙΚΗ ΧΕΙΡΟΥΡΓΙΚΗ','ΠΝΕΥΜΟΝΟΛΟΓΙΚΟ','ΠΟΝΟΣ','ΧΟΛΗΦΟΡΑ','ΣΠΟΝΔΥΛΙΚΗ ΣΤΗΛΗ','ΩΡΛ'];

function rowCount(d){
  if(!d) return 0;
  if(d.__multi__) return d.tables.reduce(function(s,t){return s+t.rows.length;},0);
  return d.rows?d.rows.length:0;
}

// ── SUPABASE ──────────────────────────────────────────────
async function sbGet(sheet){
  var r=await fetch(SB_URL+'/rest/v1/mediprice_sheets?sheet_name=eq.'+encodeURIComponent(sheet)+'&select=*',{
    headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}
  });
  var d=await r.json();
  return d&&d[0]?d[0]:null;
}

async function sbSave(sheet, headers, rows){
  var existing=await sbGet(sheet);
  var method=existing?'PATCH':'POST';
  var url=SB_URL+'/rest/v1/mediprice_sheets'+(existing?'?sheet_name=eq.'+encodeURIComponent(sheet):'');
  await fetch(url,{
    method:method,
    headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify({sheet_name:sheet,headers:headers,rows:rows,updated_at:new Date().toISOString()})
  });
}

function markPending(){
  PENDING=true;
  document.getElementById('saveBtn').style.background='#f59e0b';
  document.getElementById('saveBtn').textContent='💾 Αποθήκευση (εκκρεμεί)';
}

async function saveAll(){
  if(!cur||!D[cur]||D[cur].__multi__) return;
  var d=D[cur];
  document.getElementById('saveBtn').textContent='⏳ Αποθήκευση...';
  await sbSave(cur, d.headers, d.rows);
  PENDING=false;
  document.getElementById('saveBtn').style.background='#059669';
  document.getElementById('saveBtn').textContent='✓ Αποθηκεύτηκε';
  setTimeout(function(){
    document.getElementById('saveBtn').style.background='#1a56db';
    document.getElementById('saveBtn').textContent='💾 Αποθήκευση';
  },2000);
}

async function loadSheetFromSB(sheet){
  var d=await sbGet(sheet);
  if(d){
    if(D[sheet]&&!D[sheet].__multi__){
      D[sheet].headers=d.headers;
      D[sheet].rows=d.rows;
    }
    return true;
  }
  return false;
}

function showNotice(msg){
  var n=document.createElement('div');
  n.className='notice';n.textContent=msg;
  document.body.appendChild(n);
  setTimeout(function(){n.remove();},2000);
}

// ── EDIT MODE ─────────────────────────────────────────────
function toggleEdit(){
  if(!EDIT_MODE){
    var pass=prompt('Κωδικός επεξεργασίας:');
    if(pass!==EDIT_PASS){if(pass!==null)alert('Λάθος κωδικός!');return;}
    EDIT_MODE=true;
    document.body.classList.add('edit-mode');
    document.getElementById('editBtn').textContent='✅ Επεξεργασία';
    document.getElementById('editBtn').classList.add('active');
    document.getElementById('editBar').classList.add('show');
    document.getElementById('ta').style.paddingBottom='50px';
  } else {
    EDIT_MODE=false;
    document.body.classList.remove('edit-mode');
    document.getElementById('editBtn').textContent='✏️ Επεξεργασία';
    document.getElementById('editBtn').classList.remove('active');
    document.getElementById('editBar').classList.remove('show');
    document.getElementById('ta').style.paddingBottom='';
  }
  if(cur) showSheet(cur);
}

function getCurrentData(){
  if(!cur||!D[cur]||D[cur].__multi__) return null;
  return D[cur];
}

function makeEditable(el, onSave){
  pushUndo();
  var orig=el.textContent;
  el.classList.add('editing');
  var inp=document.createElement('input');
  inp.type='text'; inp.value=orig;
  el.innerHTML=''; el.appendChild(inp);
  inp.focus(); inp.select();
  var saved=false;
  function done(){
    if(saved) return; saved=true;
    var nv=inp.value;
    el.classList.remove('editing');
    el.textContent=nv;
    if(nv!==orig){onSave(nv); markPending();}
  }
  inp.addEventListener('blur',done);
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();inp.blur();}
    if(e.key==='Escape'){saved=true;el.classList.remove('editing');el.textContent=orig;}
    e.stopPropagation();
  });
}

function addRow(){
  var d=getCurrentData(); if(!d) return;
  pushUndo();
  var empty=d.headers.map(function(){return '';});
  var selTr=document.querySelector('#ta tbody tr.sel');
  if(selTr){
    var ri=parseInt(selTr.dataset.ri);
    if(!isNaN(ri)) d.rows.splice(ri+1,0,empty);
    else d.rows.push(empty);
  } else {
    d.rows.push(empty);
  }
  showSheet(cur);
  markPending();
}

function delRow(){
  var d=getCurrentData(); if(!d) return;
  var selTr=document.querySelector('#ta tbody tr.sel');
  if(!selTr){alert('Επιλέξτε γραμμή πρώτα!');return;}
  var ri=parseInt(selTr.dataset.ri);
  if(isNaN(ri)) return;
  if(!confirm('Διαγραφή γραμμής '+ri+'?')) return;
  pushUndo();
  d.rows.splice(ri,1);
  showSheet(cur);
  markPending();
}

function addColumn(){
  var d=getCurrentData(); if(!d) return;
  var name=prompt('Όνομα νέας στήλης:');
  if(!name) return;
  pushUndo();
  if(SEL_COL!==null && SEL_COL<d.headers.length){
    d.headers.splice(SEL_COL+1,0,name);
    d.rows.forEach(function(r){r.splice(SEL_COL+1,0,'');});
  } else {
    d.headers.push(name);
    d.rows.forEach(function(r){r.push('');});
  }
  SEL_COL=null;
  showSheet(cur);
  markPending();
}

// ── COLWIDTH ──────────────────────────────────────────────
function colW(h){

  if(W[h]!==undefined) return W[h];

}
function thCls(h){return ECOLS.indexOf(h)>=0?' ec':PCOLS.indexOf(h)>=0?' pc':'';}
function tdCls(h,v){
  if(ECOLS.indexOf(h)>=0) return ' class="ev"';
  if(PCOLS.indexOf(h)>=0) return ' class="pv"';
  if(WCOLS.indexOf(h)>=0||String(v).length>45) return ' class="wrap"';
  return '';
}
function fmtH(h){
  var p=h.trim().split(' ');
  if(p.length<=1) return h;
  return p[0]+'<br><span style="font-weight:400;font-size:10px;opacity:.8">'+p.slice(1).join(' ')+'</span>';
}
function hl(v,q){
  if(!q||!v) return String(v||'');
  return String(v).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),function(m){return '<mark>'+m+'</mark>';});
}

// ── RENDER ────────────────────────────────────────────────
function buildTH(headers,showSp){
  var s=showSp?'<th style="width:120px">Ειδικότητα<div class="resizer"></div></th>':'';
  return s+headers.map(function(h,hi){
    return '<th class="'+thCls(h).trim()+'" style="width:'+colW(h)+'px" data-hi="'+hi+'">'+fmtH(h)+'<div class="resizer"></div></th>';
  }).join('')+(EDIT_MODE?'<th class="add-col-btn" onclick="addColumn()" style="width:40px;cursor:pointer;background:#eff6ff;color:#1a56db;font-size:16px;text-align:center">+</th>':'');
}

function buildRows(headers,rows,showSp,q){
  return rows.map(function(row,ri){
    if(!Array.isArray(row)) return '';
    if(row[0]&&String(row[0]).startsWith('📌')){
      return '<tr><td colspan="'+(headers.length+(showSp?1:0))+'" style="background:#fffbeb;color:#92400e;font-size:12px;padding:6px 8px;font-style:italic;white-space:normal;word-break:break-word;">'+String(row[0]).replace('📌 ','')+'</td></tr>';
    }
    var sp=showSp?'<td><span class="spbadge">'+cur+'</span></td>':'';
    var acts='';
    var cells=row.map(function(cell,ci){
      var cls=tdCls(headers[ci],cell);
      var vs=hl(String(cell||''),q);
      var title=String(cell||'').length>35&&cls===''?' title="'+String(cell||'').replace(/"/g,'&quot;')+'"':'';
      return '<td'+cls+title+' data-ri="'+ri+'" data-ci="'+ci+'">'+vs+'</td>';
    }).join('');
    return '<tr data-ri="'+ri+'">'+acts+sp+cells+'</tr>';
  }).join('');
}

function renderTbl(headers,rows,showSp,q){
  if(!rows.length){
    document.getElementById('ta').innerHTML='<div class="state"><div class="state-icon">🔍</div><div class="state-title">Δεν βρέθηκαν αποτελέσματα</div></div>';
    return;
  }
  var html='<table><thead><tr>'+buildTH(headers,showSp)+'</tr></thead><tbody>'+buildRows(headers,rows,showSp,q)+'</tbody></table>';
  if(EDIT_MODE) html+='<button class="add-row-btn" onclick="addRow()">+ Προσθήκη γραμμής</button>';
  document.getElementById('ta').innerHTML=html;
  addResizers();
  if(EDIT_MODE) addEditListeners(headers);
}

function addEditListeners(headers){
  // Header edit
  document.querySelectorAll('thead th[data-hi]').forEach(function(th){
    th.addEventListener('click',function(e){
      if(e.detail>1) return;
      document.querySelectorAll('#ta thead th').forEach(function(t){t.classList.remove('col-selected');});
      SEL_COL=parseInt(th.dataset.hi);
      th.classList.add('col-selected');
    });
    th.addEventListener('dblclick',function(e){
      e.stopPropagation();
      var hi=parseInt(th.dataset.hi);
      var d=getCurrentData(); if(!d) return;
      makeEditable(th,function(nv){
        d.headers[hi]=nv;
        markPending();
        showSheet(cur);
      });
    });
  });
  // Cell edit
  document.querySelectorAll('tbody td[data-ri]').forEach(function(td){
    td.addEventListener('dblclick',function(e){
      var ri=parseInt(td.dataset.ri);
      var ci=parseInt(td.dataset.ci);
      var d=getCurrentData(); if(!d) return;
      makeEditable(td,function(nv){
        d.rows[ri][ci]=nv;
        markPending();
      });
    });
  });
}

function renderMulti(tables,q){
  var html='<div style="padding:8px;display:flex;flex-direction:column;gap:16px">';
  tables.forEach(function(t){
    var th=buildTH(t.headers,false);
    var rows=buildRows(t.headers,t.rows,false,q);
    html+='<div><div class="tbl-title">'+t.title+'</div><table><thead><tr>'+th+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
  });
  html+='</div>';
  document.getElementById('ta').innerHTML=html;
  addResizers();
}

// ── INIT ──────────────────────────────────────────────────
async function init(){
  try{
    var r=await fetch('data.json'); D=await r.json();
    // Load overrides from Supabase for non-multi sheets
    var loadPromises=Object.keys(D).filter(function(k){return !D[k].__multi__;}).map(function(k){return loadSheetFromSB(k);});
    await Promise.all(loadPromises);
    var ks=Object.keys(D),total=ks.reduce(function(s,k){return s+rowCount(D[k]);},0);
    document.getElementById('badge').textContent=ks.length+' ειδικότητες · '+total+' εγγραφές';
    renderSB(); welcome();
  }catch(e){
    document.getElementById('ta').innerHTML='<div class="state"><div class="state-icon">⚠️</div><div class="state-title">'+e.message+'</div></div>';
  }
}

function welcome(){
  document.getElementById('cH').style.display='none';
  document.getElementById('ta').innerHTML='<div class="state"><div class="state-icon">🏥</div><div class="state-title">Καλώς ήρθατε στο MediPrice</div><div class="state-sub">Επιλέξτε ειδικότητα ή αναζητήστε πράξη</div></div>';
}

function renderSB(f){
  f=f||''; var el=document.getElementById('spL');
  var all=Object.keys(D);
  var keys=ORDER.filter(function(k){return all.indexOf(k)>=0&&k.toLowerCase().indexOf(f.toLowerCase())>=0;});
  all.forEach(function(k){if(ORDER.indexOf(k)<0&&k.toLowerCase().indexOf(f.toLowerCase())>=0) keys.push(k);});
  if(!keys.length){el.innerHTML='<div style="padding:12px;text-align:center;color:var(--mut);font-size:12px">Δεν βρέθηκε</div>';return;}
  el.innerHTML=keys.map(function(k){
    return '<div class="spi'+(cur===k&&!sMode?' active':'')+'" onclick="showSheet(\''+k.replace(/'/g,"\\'")+'\')">'
      +'<span class="spn">'+k+'</span><span class="spc">'+rowCount(D[k])+'</span></div>';
  }).join('');
}

function showSheet(name){
  sMode=false;
  document.getElementById('gS').value='';
  document.getElementById('gC').style.display='none';
  cur=name; renderSB(document.getElementById('spF').value);
  document.getElementById('ta').scrollTop=0;
  var d=D[name]; if(!d) return;
  document.getElementById('cH').style.display='flex';
  document.getElementById('cT').textContent=name;
  document.getElementById('cS').textContent='· '+rowCount(d)+' εγγραφές';
  if(d.__multi__) renderMulti(d.tables,'');
  else renderTbl(d.headers,d.rows,false,'');
}

function doSearch(q){
  if(!q||q.length<2) return;
  sMode=true; cur=null; renderSB(document.getElementById('spF').value);
  var ql=q.toLowerCase(), grouped={};
  Object.keys(D).forEach(function(sp){
    var d=D[sp];
    if(d.__multi__){
      d.tables.forEach(function(t){
        t.rows.forEach(function(row){
          if(!Array.isArray(row)) return;
          if(t.title.toLowerCase().indexOf(ql)>=0||row.some(function(c){return String(c).toLowerCase().indexOf(ql)>=0;})){
            if(!grouped[sp]) grouped[sp]={headers:t.headers,items:[]};
            grouped[sp].items.push(row);
          }
        });
      });
    } else {
      if(!d.rows) return;
      d.rows.forEach(function(row){
        if(!Array.isArray(row)) return;
        if(row.some(function(c){return String(c).toLowerCase().indexOf(ql)>=0;})){
          if(!grouped[sp]) grouped[sp]={headers:d.headers,items:[]};
          grouped[sp].items.push(row);
        }
      });
    }
  });
  var total=Object.values(grouped).reduce(function(s,g){return s+g.items.length;},0);
  document.getElementById('cH').style.display='flex';
  document.getElementById('cT').textContent='"'+q+'"';
  document.getElementById('cS').textContent='· '+total+' αποτελέσματα';
  if(!total){document.getElementById('ta').innerHTML='<div class="state"><div class="state-icon">🔍</div><div class="state-title">Δεν βρέθηκαν αποτελέσματα</div></div>';return;}
  var html='<div style="padding:8px;display:flex;flex-direction:column;gap:12px">';
  Object.keys(grouped).forEach(function(sp){
    var g=grouped[sp];
    var th='<th style="width:120px;background:#eff6ff;color:var(--acc)">Ειδικότητα<div class="resizer"></div></th>'+g.headers.map(function(h){return '<th class="'+thCls(h).trim()+'" style="width:'+colW(h)+'px">'+fmtH(h)+'<div class="resizer"></div></th>';}).join('');
    var rows=g.items.map(function(row){
      var cells=row.map(function(cell,ci){var cls=tdCls(g.headers[ci],cell);return '<td'+cls+'>'+hl(String(cell||''),q)+'</td>';}).join('');
      return '<tr><td><span class="spbadge">'+sp+'</span></td>'+cells+'</tr>';
    }).join('');
    html+='<table><thead><tr>'+th+'</tr></thead><tbody>'+rows+'</tbody></table>';
  });
  html+='</div>';
  document.getElementById('ta').innerHTML=html;
  document.getElementById('ta').scrollTop=0;
  addResizers();
}

function addResizers(){
  document.querySelectorAll('thead th').forEach(function(th){
    var r=th.querySelector('.resizer'); if(!r) return;
    var sx,sw;
    r.addEventListener('mousedown',function(e){
      e.preventDefault(); sx=e.pageX; sw=th.offsetWidth;
      document.body.style.cursor='col-resize';
      function mv(e){th.style.width=Math.max(30,sw+e.pageX-sx)+'px';}
      function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);document.body.style.cursor='';}
      document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
    });
  });
}

// Row selection
document.getElementById('ta').addEventListener('click',function(e){
  if(e.target.closest('button')) return;
  var tr=e.target.closest('tbody tr'); if(!tr) return;
  var was=tr.classList.contains('sel');
  document.querySelectorAll('#ta tbody tr.sel').forEach(function(r){r.classList.remove('sel');});
  if(!was) tr.classList.add('sel');
});

// Tooltip
var tip=document.getElementById('tooltip');
document.getElementById('ta').addEventListener('mouseover',function(e){
  var td=e.target.closest('td[title]');
  if(!td){tip.style.display='none';return;}
  tip.textContent=td.getAttribute('title'); tip.style.display='block';
});
document.getElementById('ta').addEventListener('mousemove',function(e){tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';});
document.getElementById('ta').addEventListener('mouseleave',function(){tip.style.display='none';});

var st;
document.getElementById('gS').addEventListener('input',function(e){
  var q=e.target.value.trim();
  document.getElementById('gC').style.display=q?'flex':'none';
  clearTimeout(st);
  if(q.length>=2) st=setTimeout(function(){doSearch(q);},350);
  else if(!q){sMode=false;cur=null;renderSB();welcome();}
});
document.getElementById('gC').addEventListener('click',function(){
  document.getElementById('gS').value=''; document.getElementById('gC').style.display='none';
  sMode=false;cur=null;renderSB();welcome();
});
document.getElementById('spF').addEventListener('input',function(e){renderSB(e.target.value);});

init();
</script>
