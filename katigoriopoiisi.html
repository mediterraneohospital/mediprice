<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Κατηγοριοποίηση Επεμβάσεων — MediPrice</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#faf8f5;--sur:#ffffff;--s2:#f3efe8;--brd:#e8e1d5;--txt:#1b2130;--mut:#7c8494;
  --acc:#3b6fe0;--acc-bg:#eef0e6;--acc-txt:#1e4fbf;
  --grn:#1f9d6f;--grn-bg:#eef3e5;--grn-txt:#0f7a53;
  --pill-bg:#f0ede4;--pill-txt:#6b6152;
  --amb-bg:#fdf3da;--amb-txt:#8a5a0b;
  --r:12px;--r-sm:8px;
}
[data-dark]{
  --bg:#161a26;--sur:#1f2432;--s2:#262c3d;--brd:#333b52;--txt:#e7eaf3;--mut:#8b93aa;
  --acc:#6d93f0;--acc-bg:#1c2c4d;--acc-txt:#9db8f7;
  --grn:#3fcf99;--grn-bg:#123729;--grn-txt:#5fe0ae;
  --pill-bg:#2a3143;--pill-txt:#a7aec2;
  --amb-bg:#3a2c10;--amb-txt:#f0b358;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;font-family:'Inter',sans-serif;font-size:13.5px;background:var(--bg);color:var(--txt);}
#app{display:grid;grid-template-columns:270px 1fr;grid-template-rows:52px 1fr;height:100vh;}
header{grid-column:1/3;background:var(--sur);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:12px;padding:0 18px;flex-shrink:0;}
header .back{display:flex;align-items:center;gap:6px;color:var(--mut);text-decoration:none;font-size:12.5px;background:var(--s2);border:1px solid var(--brd);border-radius:var(--r-sm);padding:0 12px;height:32px;}
header .back:hover{color:var(--txt);border-color:var(--acc);}
header .sep{width:1px;height:20px;background:var(--brd);}
header .title{font-weight:700;font-size:15px;}
header .title span{color:#e0362b;}
header .hosp{font-size:12px;color:var(--mut);}
#darkBtn{margin-left:auto;background:var(--s2);border:1px solid var(--brd);border-radius:var(--r-sm);color:var(--txt);width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#darkBtn:hover{border-color:var(--acc);}

.sidebar{background:var(--sur);border-right:1px solid var(--brd);display:flex;flex-direction:column;overflow:hidden;}
.ins-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:10px 10px 0;flex-shrink:0;}
.ins-tab{text-align:center;padding:8px 4px;border-radius:var(--r-sm);font-size:11.5px;font-weight:700;color:var(--mut);cursor:pointer;background:var(--s2);border:1px solid var(--brd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ins-tab.active{background:var(--sur);color:var(--acc-txt);border-color:var(--acc);}
.sb-search{padding:10px;border-bottom:1px solid var(--brd);}
.search-box{display:flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--brd);border-radius:var(--r-sm);padding:0 10px;height:34px;}
.search-box:focus-within{border-color:var(--acc);}
.search-box i.ti-search{color:var(--mut);font-size:15px;flex-shrink:0;}
.search-box input{flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:12.5px;color:var(--txt);font-family:inherit;padding:0;height:100%;}
.clear-search-btn{display:none;background:var(--pill-bg);border:none;color:var(--mut);cursor:pointer;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;padding:0;flex-shrink:0;}
.clear-search-btn.show{display:flex;}
.clear-search-btn:hover{background:var(--acc);color:#fff;}
.sb-list{overflow-y:auto;flex:1;padding:8px;}
.sb-item{padding:9px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;color:var(--txt);margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.sb-item:hover{background:var(--s2);}
.sb-item.active{background:var(--acc-bg);color:var(--acc-txt);font-weight:600;}
.sb-count{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;background:var(--pill-bg);padding:1px 7px;border-radius:20px;}
.sb-item.active .sb-count{background:var(--sur);color:var(--acc-txt);}
.sb-item.spec-dim{opacity:.4;}

.active-filters{display:flex;gap:6px;flex-wrap:wrap;padding:0 24px 12px;flex-shrink:0;}
.filter-pill{display:flex;align-items:center;gap:6px;background:var(--acc-bg);color:var(--acc-txt);border-radius:20px;padding:5px 8px 5px 12px;font-size:11.5px;font-weight:600;}
.filter-pill button{background:none;border:none;color:var(--acc-txt);cursor:pointer;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;opacity:.75;}
.filter-pill button:hover{opacity:1;background:rgba(0,0,0,.08);}
.clear-all-btn{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--brd);color:var(--mut);border-radius:20px;padding:5px 12px;font-size:11.5px;cursor:pointer;font-family:inherit;}
.clear-all-btn:hover{color:var(--txt);border-color:var(--acc);}

.gs-drop{position:absolute;top:38px;left:10px;right:10px;background:var(--sur);border:1px solid var(--brd);border-radius:var(--r-sm);box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:360px;overflow-y:auto;z-index:50;display:none;}
.gs-drop.open{display:block;}
.gs-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--brd);}
.gs-item:last-child{border-bottom:none;}
.gs-item:hover{background:var(--s2);}
.gs-item .gs-desc{font-size:12px;color:var(--txt);margin-bottom:3px;line-height:1.4;}
.gs-item .gs-desc mark{background:var(--acc-bg);color:var(--acc-txt);border-radius:3px;padding:0 2px;}
.gs-item .gs-meta{display:flex;gap:6px;align-items:center;font-size:10.5px;color:var(--mut);}
.gs-item .gs-sp{background:var(--pill-bg);color:var(--pill-txt);border-radius:10px;padding:1px 7px;}
.gs-item .gs-cat{border-radius:10px;padding:1px 7px;}
.gs-empty{padding:12px;font-size:12px;color:var(--mut);text-align:center;}
.gs-more{padding:8px 12px;font-size:11px;color:var(--mut);text-align:center;font-style:italic;}

main{overflow:hidden;display:flex;flex-direction:column;}
.placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut);}
.placeholder i{font-size:44px;opacity:.4;}
.placeholder p{font-size:13px;max-width:340px;text-align:center;line-height:1.5;}

.detail{display:flex;flex-direction:column;overflow:hidden;flex:1;min-height:0;}
.det-head{padding:16px 24px 12px;border-bottom:1px solid var(--brd);flex-shrink:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.det-name{font-size:17px;font-weight:700;}
.det-searchbox{position:relative;margin-left:auto;width:280px;}
.det-searchbox input{width:100%;background:var(--s2);border:1px solid var(--brd);border-radius:20px;padding:7px 12px 7px 32px;font-size:12px;color:var(--txt);outline:none;font-family:inherit;}
.det-searchbox i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:14px;}
.det-searchbox input:focus{border-color:var(--acc);}

.cat-chips{display:flex;gap:6px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--brd);flex-shrink:0;}
.cat-chip{font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;cursor:pointer;border:1px solid var(--brd);background:var(--s2);color:var(--mut);}
.cat-chip.active{background:var(--acc);border-color:var(--acc);color:#fff;}
.cat-chip .n{opacity:.7;font-weight:500;margin-left:3px;}

.table-wrap{flex:1;overflow:auto;}
table{border-collapse:collapse;width:auto;max-width:100%;font-size:12.8px;}
th{background:var(--s2);color:var(--mut);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;padding:8px 14px;text-align:left;border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:1;}
th.code{width:70px;}th.cat{width:150px;}th.fee{width:80px;text-align:center;}
th.spec{width:190px;}
th.desc{min-width:320px;max-width:640px;}
td.desc{max-width:640px;}
td{padding:8px 14px;border-bottom:1px solid var(--brd);vertical-align:top;}
td.code{font-family:'DM Mono',monospace;color:var(--mut);font-size:11.5px;}
tbody tr:hover{background:var(--s2);}
.cat-badge{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.cat-badge.c1{background:var(--grn-bg);color:var(--grn-txt);}
.cat-badge.c2{background:var(--acc-bg);color:var(--acc-txt);}
.cat-badge.c3{background:var(--pill-bg);color:var(--pill-txt);}
.cat-badge.c4{background:var(--amb-bg);color:var(--amb-txt);}
.cat-badge.c5{background:#fde3d3;color:#b5560f;}
.cat-badge.c6{background:#fbe3e3;color:#c0392b;}
.cat-badge.c7{background:#f0e3fb;color:#7b3ec0;}
[data-dark] .cat-badge.c5{background:#3a2410;color:#f0a35a;}
[data-dark] .cat-badge.c6{background:#3a1f1f;color:#f0908f;}
[data-dark] .cat-badge.c7{background:#2a1c3a;color:#c295f0;}
.empty-note{padding:40px;text-align:center;color:var(--mut);font-size:12.5px;}

@media(max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:52px 200px 1fr;}
  .sidebar{grid-row:2;border-right:none;border-bottom:1px solid var(--brd);}
  header .hosp{display:none;}
  .det-searchbox{width:100%;margin-left:0;}
}

td.fee{text-align:center;}
.fee-chip{background:var(--grn-bg);color:var(--grn-txt);border:1px solid transparent;border-radius:14px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
.fee-chip:hover{border-color:var(--grn);}
.fee-chip.none{background:var(--pill-bg);color:var(--pill-txt);cursor:default;}
.fee-pop-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;display:flex;align-items:center;justify-content:center;}
.fee-pop{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);padding:18px 20px;min-width:280px;max-width:360px;box-shadow:0 12px 40px rgba(0,0,0,.25);}
.fee-pop h4{margin:0 0 10px;font-size:13.5px;color:var(--txt);}
.fee-pop .fee-row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--brd);font-size:12.5px;gap:12px;}
.fee-pop .fee-row:last-child{border-bottom:none;}
.fee-pop .fee-lbl{color:var(--mut);flex-shrink:0;}
.fee-pop .fee-val{font-weight:700;color:var(--txt);text-align:right;}
.fee-pop .fee-val small{display:block;font-weight:500;color:var(--mut);font-size:10.5px;}
.fee-pop .fee-note{margin-top:10px;padding:10px 11px;background:var(--s2);border:1px solid var(--brd);border-radius:var(--r-sm);}
.fee-pop .fee-note-title{font-size:11px;font-weight:700;color:var(--mut);margin-bottom:6px;}
.fee-pop .fee-note-text{font-size:11.5px;line-height:1.5;color:var(--txt);white-space:pre-wrap;}
.fee-pop .fee-close{margin-top:12px;width:100%;background:var(--s2);border:1px solid var(--brd);border-radius:var(--r-sm);padding:7px;cursor:pointer;color:var(--txt);font-family:inherit;font-size:12px;}

/* ΕΘΝΙΚΗ — Υπολογιστής Παρακολούθησης / Συμπαρακολούθησης */
.follow-calc-launch{
  display:none;align-items:center;gap:7px;margin-left:8px;
  background:var(--acc);color:#fff;border:1px solid var(--acc);border-radius:20px;
  padding:7px 13px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;
  white-space:nowrap;
}
.follow-calc-launch:hover{filter:brightness(.96);}
.follow-calc-launch.show{display:flex;}

.follow-modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:300;
  display:flex;align-items:center;justify-content:center;padding:18px;
}
.follow-modal{
  width:min(760px,96vw);max-height:92vh;overflow:auto;
  background:var(--sur);border:1px solid var(--brd);border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.30);
}
.follow-modal-head{
  display:flex;align-items:flex-start;gap:12px;padding:20px 22px 15px;
  border-bottom:1px solid var(--brd);
}
.follow-modal-title{font-size:17px;font-weight:800;margin:0 0 4px;}
.follow-modal-sub{font-size:11.5px;color:var(--mut);line-height:1.45;}
.follow-modal-x{
  margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--brd);
  background:var(--s2);color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.follow-modal-body{padding:18px 22px 22px;}
.follow-visit-box{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 12px;margin-bottom:14px;border:1px solid var(--brd);
  background:var(--s2);border-radius:9px;
}
.follow-visit-box .lbl{font-size:11px;font-weight:800;color:var(--txt);}
.follow-visit-box .val{font-size:15px;font-weight:850;color:var(--txt);white-space:nowrap;}
.follow-seg{
  display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;background:var(--s2);
  border:1px solid var(--brd);border-radius:10px;margin-bottom:16px;
}
.follow-seg button{
  border:0;border-radius:7px;padding:9px 10px;background:transparent;color:var(--mut);
  font-family:inherit;font-size:11.5px;font-weight:800;cursor:pointer;
}
.follow-seg button.active{background:var(--sur);color:var(--acc-txt);box-shadow:0 2px 8px rgba(0,0,0,.08);}
.follow-input-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.follow-field label{display:block;font-size:11px;font-weight:800;color:var(--txt);margin-bottom:6px;}
.follow-field input{
  width:100%;height:40px;background:var(--sur);border:1px solid var(--brd);
  border-radius:9px;color:var(--txt);font:inherit;padding:0 12px;outline:none;
}
.follow-field input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(59,111,224,.10);}
.follow-hint{font-size:10.5px;color:var(--mut);margin-top:5px;}
.follow-error{
  margin-top:12px;padding:9px 10px;border-radius:8px;background:#fff0f0;
  border:1px solid #f0cccc;color:#a73636;font-size:11px;display:none;
}
[data-dark] .follow-error{background:#3a2023;border-color:#63343a;color:#f2a7ad;}
.follow-result{
  margin-top:16px;padding:15px;border-radius:12px;background:var(--grn-bg);
  border:1px solid #cfe5d9;
}
.follow-result.hidden{display:none;}
.follow-result-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:12px;}
.follow-result-label{font-size:11px;font-weight:800;color:var(--grn-txt);margin-bottom:3px;}
.follow-total{font-size:27px;font-weight:900;color:var(--grn-txt);}
.follow-days{font-size:10.5px;color:var(--mut);text-align:right;line-height:1.4;}
.follow-breakdown{
  width:100%;max-width:none;border-collapse:collapse;background:var(--sur);border-radius:9px;overflow:hidden;
}
.follow-breakdown th,.follow-breakdown td{
  position:static;background:transparent;padding:8px 9px;border-bottom:1px solid var(--brd);
  font-size:10.5px;text-transform:none;letter-spacing:0;color:var(--txt);
}
.follow-breakdown th{font-weight:800;color:var(--mut);background:var(--s2);}
.follow-breakdown td:last-child,.follow-breakdown th:last-child{text-align:right;}
.follow-breakdown tr:last-child td{border-bottom:0;}
.follow-rates{margin-top:17px;padding-top:15px;border-top:1px solid var(--brd);}
.follow-rates-title{font-size:11.5px;font-weight:800;margin-bottom:9px;}
.follow-rate-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.follow-rate-box{padding:10px 11px;border:1px solid var(--brd);border-radius:9px;background:var(--s2);}
.follow-rate-box strong{display:block;font-size:10.5px;margin-bottom:5px;}
.follow-rate-row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:10px;color:var(--mut);}
.follow-rate-row b{color:var(--txt);font-weight:700;white-space:nowrap;}
.follow-footnote{font-size:10px;color:var(--mut);margin-top:9px;line-height:1.45;}
.follow-actions{display:flex;justify-content:flex-end;margin-top:13px;}
.follow-clear{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--brd);
  background:var(--s2);color:var(--mut);border-radius:8px;padding:7px 10px;
  font-family:inherit;font-size:10.5px;font-weight:750;cursor:pointer;
}
.follow-clear:hover{color:var(--txt);background:var(--sur);}

@media(max-width:650px){
  .follow-input-grid,.follow-rate-grid{grid-template-columns:1fr;}
  .follow-result-top{align-items:flex-start;flex-direction:column;}
  .follow-days{text-align:left;}
  .follow-calc-launch{margin-left:0;}
}

</style>
</head>
<body>
<div id="app">
<header>
<a class="back" href="index.html"><i class="ti ti-arrow-left"></i> MediPrice</a>
<div class="sep"></div>
<span class="title">Κατηγοριοποίηση <span>Επεμβάσεων</span></span>
<span class="hosp">Mediterraneo Hospital</span>
<button id="darkBtn" onclick="toggleDark()"><i class="ti ti-moon"></i></button>
</header>
<div class="sidebar">
<div class="ins-tabs" id="insTabs"></div>
<div class="sb-search">
<div class="search-box">
<i class="ti ti-search"></i>
<input id="procSearch" placeholder="Αναζήτηση πράξης..." oninput="onProcSearch(this.value)">
<button id="clearSearchBtn" onclick="clearSearch()" class="clear-search-btn"><i class="ti ti-x"></i></button>
</div>
</div>
<div class="sb-list" id="sbList"></div>
</div>
<main id="mainArea">
<div class="detail" id="detail">
<div class="det-head">
<div class="det-name" id="detName">Όλες οι ειδικότητες — MEDNET</div>
<button id="followCalcLaunch" class="follow-calc-launch" onclick="openFollowCalculator()"><i class="ti ti-calculator"></i> Υπολογιστής παρακολούθησης</button>
</div>
<div class="active-filters" id="activeFilters" style="display:none;"></div>
<div class="cat-chips" id="catChips"></div>
<div class="table-wrap">
<table>
<thead><tr><th class="code">Κωδικός</th><th class="desc">Περιγραφή</th><th class="spec">Ειδικότητα</th><th class="cat">Κατηγορία</th><th class="fee">Αμοιβές</th></tr></thead>
<tbody id="rowsBody"></tbody>
</table>
</div>
</div>
</main>
</div>

<script src="kat_data.js"></script>
<script>
var INSURERS = [
  {key:'MEDNET', label:'MEDNET', data: (typeof KAT_MEDNET!=='undefined'?KAT_MEDNET:[])},
  {key:'ETHNIKI', label:'ΕΘΝΙΚΗ', data: (typeof KAT_ETHNIKI!=='undefined'?KAT_ETHNIKI:[])},
  {key:'INTER', label:'INTERAMERICAN', data: (typeof KAT_INTER!=='undefined'?KAT_INTER:[])},
  {key:'ALLIANZ', label:'ALLIANZ', data: (typeof KAT_ALLIANZ!=='undefined'?KAT_ALLIANZ:[])},
];
var currentIns = 0;
var currentCat = null;
var currentQuery = '';
var currentSpecialty = null; // click-filter on sidebar breakdown, not a search field

var CAT_ORDER = ['ΠΟΛΥ ΜΙΚΡΕΣ','ΜΙΚΡΕΣ','ΜΕΣΑΙΕΣ','ΜΕΓΑΛΕΣ','ΒΑΡΕΙΕΣ','ΕΞΑΙΡΕΤΙΚΑ ΒΑΡΕΙΕΣ','ΕΙΔΙΚΕΣ'];
function catClass(num){ return 'c'+num; }
function norm(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/ς/g,'σ'); }

function renderInsTabs(){
  var host = document.getElementById('insTabs');
  host.innerHTML = INSURERS.map(function(ins, i){
    return '<div class="ins-tab'+(i===currentIns?' active':'')+'" onclick="selectInsurer('+i+')">'+ins.label+'</div>';
  }).join('');
}
function selectInsurer(i){
  currentIns = i;
  renderInsTabs();
  updateView();
}

function onProcSearch(v){
  currentQuery = v;
  document.getElementById('clearSearchBtn').classList.toggle('show', !!v);
  updateView();
}
function clearSearch(){
  currentQuery = '';
  var input = document.getElementById('procSearch');
  input.value = '';
  document.getElementById('clearSearchBtn').classList.remove('show');
  input.focus();
  updateView();
}

function sortRowsBySpecialtyPreserveOrder(rows){
  // Αλφαβητική σειρά ειδικοτήτων (Α→Ω), χωρίς να αλλάζει η αρχική σειρά
  // των πράξεων μέσα στην ίδια ειδικότητα.
  return rows.map(function(r, i){ return {row:r, originalIndex:i}; })
    .sort(function(a, b){
      var cmp = (a.row.specialty||'').localeCompare((b.row.specialty||''), 'el-GR', {sensitivity:'base'});
      return cmp || (a.originalIndex - b.originalIndex);
    })
    .map(function(x){ return x.row; });
}
function getFilteredRows(){
  var data = INSURERS[currentIns].data;
  var nq = norm(currentQuery);
  var rows = data.filter(function(r){
    if(currentSpecialty && r.specialty!==currentSpecialty) return false;
    if(currentCat && r.category_label!==currentCat) return false;
    if(nq && norm(r.description).indexOf(nq)<0 && norm(r.code).indexOf(nq)<0) return false;
    return true;
  });
  return sortRowsBySpecialtyPreserveOrder(rows);
}
function getFilteredRowsIgnoringCat(){
  var data = INSURERS[currentIns].data;
  var nq = norm(currentQuery);
  return data.filter(function(r){
    if(currentSpecialty && r.specialty!==currentSpecialty) return false;
    if(nq && norm(r.description).indexOf(nq)<0 && norm(r.code).indexOf(nq)<0) return false;
    return true;
  });
}
function getFilteredRowsIgnoringSpecialty(){
  var data = INSURERS[currentIns].data;
  var nq = norm(currentQuery);
  return data.filter(function(r){
    if(nq && norm(r.description).indexOf(nq)<0 && norm(r.code).indexOf(nq)<0) return false;
    return true;
  });
}

function updateView(){
  var label = (currentQuery ? 'Αποτελέσματα για "'+currentQuery+'"' : 'Όλες οι ειδικότητες') + (currentSpecialty ? ' · '+currentSpecialty : '');
  document.getElementById('detName').textContent = label + ' — ' + INSURERS[currentIns].label;
  var calcBtn = document.getElementById('followCalcLaunch');
  if(calcBtn) calcBtn.classList.toggle('show', INSURERS[currentIns].key === 'ETHNIKI');
  renderActiveFilters();
  renderSidebarBreakdown();
  renderChips();
  renderRows();
}

function renderActiveFilters(){
  var host = document.getElementById('activeFilters');
  var pills = [];
  if(currentSpecialty){
    pills.push('<div class="filter-pill"><i class="ti ti-stethoscope" style="font-size:12px;"></i> '+currentSpecialty+'<button onclick="toggleSpecialty(\''+currentSpecialty.replace(/'/g,"\\'")+'\')" title="Αφαίρεση φίλτρου"><i class="ti ti-x"></i></button></div>');

function renderSidebarBreakdown(){
  var rows = getFilteredRowsIgnoringSpecialty();
  var map = {};
  rows.forEach(function(r){ if(r.specialty) map[r.specialty] = (map[r.specialty]||0)+1; });
  var specs = Object.keys(map).sort(function(a,b){ return a.localeCompare(b,'el-GR',{sensitivity:'base'}); });
  var list = document.getElementById('sbList');
  if(!specs.length){ list.innerHTML = '<div class="sb-item" style="opacity:.5;cursor:default;">Καμία πράξη δεν βρέθηκε.</div>'; return; }
  list.innerHTML = specs.map(function(name){
    var active = currentSpecialty===name ? ' active' : '';
    return '<div class="sb-item'+active+'" onclick="toggleSpecialty(\''+name.replace(/'/g,"\\'")+'\')"><span>'+name+'</span><span class="sb-count">'+map[name]+'</span></div>';
  }).join('');
}

function renderChips(){
  var rowsNoCat = getFilteredRowsIgnoringCat();

  rowsNoCat.forEach(function(r){ counts[r.category_label] = (counts[r.category_label]||0)+1; });
  var host = document.getElementById('catChips');
  var total = rowsNoCat.length;
  var chips = '<div class="cat-chip'+(currentCat===null?' active':'')+'" onclick="setCat(null)">ΟΛΕΣ <span class="n">'+total+'</span></div>';
  CAT_ORDER.forEach(function(cat){
    if(!counts[cat]) return;
    chips += '<div class="cat-chip'+(currentCat===cat?' active':'')+'" onclick="setCat(\''+cat+'\')">'+cat+' <span class="n">'+counts[cat]+'</span></div>';
  });
  host.innerHTML = chips;

function setCat(cat){ currentCat = cat; renderChips(); renderRows(); }

function highlightMark(text, nq){
  if(!nq) return text;
  var nt = norm(text);
  var idx = nt.indexOf(nq);
  if(idx<0) return text;
  return text.slice(0,idx) + '<mark>' + text.slice(idx, idx+nq.length) + '</mark>' + text.slice(idx+nq.length);
}

function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function getFeesFor(r){
  if(typeof FEES_ETHNIKI === 'undefined') return null;
  if(r.specialty === 'ΕΠΕΜΒΑΤΙΚΕΣ ΚΑΡΔΙΟΛΟΓΙΚΕΣ ΠΡΑΞΕΙΣ'){
    var item = FEES_ETHNIKI.interventional_cardiology && FEES_ETHNIKI.interventional_cardiology[r.description];
    if(!item) return null;
    return {surgeon:item.fee, assistant:null, anesth:null, doctorLabel:'Αμοιβή Ιατρού', note:item.note||null};
  }
  if(r.specialty === 'ΕΠΕΜΒΑΤΙΚΕΣ ΠΡΑΞΕΙΣ'){
    var item = FEES_ETHNIKI.medical_procedures && FEES_ETHNIKI.medical_procedures[r.fee_key || r.description];
    if(!item) return null;
    return {surgeon:item.fee, feeText:item.fee_text||null, assistant:null, anesth:null, doctorLabel:'Αμοιβή Ιατρού', note:item.note||null};
  }
  if(r.specialty === 'ΑΝΑΙΣΘΗΣΙΟΛΟΓΙΚΕΣ ΠΡΑΞΕΙΣ'){
    var item = FEES_ETHNIKI.anesthesiology_procedures && FEES_ETHNIKI.anesthesiology_procedures[r.fee_key || r.description];
    if(!item) return null;
    return {surgeon:null, assistant:null, anesth:{'':item.fee}, hideDoctor:true, note:item.note||null};
  }
  if(r.specialty === 'ΓΑΣΤΡΕΝΤΕΡΟΛΟΓΙΚΕΣ ΠΡΑΞΕΙΣ'){
    var item = FEES_ETHNIKI.gastroenterology_procedures && FEES_ETHNIKI.gastroenterology_procedures[r.fee_key || r.description];
    if(!item) return null;
    return {surgeon:item.fee, assistant:null, anesth:null, doctorLabel:'Αμοιβή Ιατρού', note:item.note||null};
  }
  if(r.specialty === 'ΜΙΚΡΟΧΕΙΡΟΥΡΓΙΚΗ'){
    var amt = FEES_ETHNIKI.microsurgery[r.code];
    if(amt===undefined || amt===null) return null;
    return {surgeon: amt, assistant: null, anesth: null};
  }
  var s = FEES_ETHNIKI.surgeon[r.specialty];
  var surgeonFee = s ? s[r.category_label] : undefined;
  var assistFee = FEES_ETHNIKI.assistant[r.category_label];
  // Κάποιες παραλλαγές αναισθησίας ισχύουν ΜΟΝΟ για συγκεκριμένη ειδικότητα
  // (π.χ. «ΟΦΘΑΛΜΟΛΟΓΙΚΑ» δεν είναι τεχνική αναισθησίας — είναι ειδική τιμή μόνο για οφθαλμολογικές πράξεις)
  var SPECIALTY_ONLY_VARIANTS = {'ΟΦΘΑΛΜΟΛΟΓΙΚΑ':'ΟΦΘΑΛΜΟΛΟΓΙΚΕΣ'};
  var rawAnesth = FEES_ETHNIKI.anesthesiologist[r.category_label];
  var anesthOpts = null;
  if(rawAnesth){
    anesthOpts = {};
    for(var k in rawAnesth){
      var restrictedTo = SPECIALTY_ONLY_VARIANTS[k];
      if(restrictedTo && r.specialty !== restrictedTo) continue;
      anesthOpts[k] = rawAnesth[k];
    }
    if(Object.keys(anesthOpts).length===0) anesthOpts = null;
  }
  if((surgeonFee===undefined||surgeonFee===null||surgeonFee===0) && !assistFee && !anesthOpts) return null;
  return {surgeon: surgeonFee, assistant: assistFee, anesth: anesthOpts};
}
function fmtEur(v){ return (v===undefined||v===null) ? '—' : ('€'+v.toLocaleString('el-GR',{minimumFractionDigits:2,maximumFractionDigits:2})); }
function closeFeePopover(host){
  if(!host) return;
  if(host._onEsc) document.removeEventListener('keydown', host._onEsc);
  host.remove();
}
function showFeePopover(idx, rowsRef){
  var r = rowsRef[idx];
  var f = getFeesFor(r);
  if(!f) return;
  var rowsHtml = '';
  var doctorLabel = f.doctorLabel || 'Χειρουργός';
  if(!f.hideDoctor){
    rowsHtml += '<div class="fee-row"><span class="fee-lbl"><i class="ti ti-scalpel" style="font-size:13px;margin-right:5px;"></i>'+escapeHtml(doctorLabel)+'</span><span class="fee-val">'+(f.feeText ? escapeHtml(f.feeText) : fmtEur(f.surgeon))+'</span></div>';
  }
  if(f.assistant!==null && f.assistant!==undefined){
    rowsHtml += '<div class="fee-row"><span class="fee-lbl"><i class="ti ti-user-plus" style="font-size:13px;margin-right:5px;"></i>Βοηθός</span><span class="fee-val">'+fmtEur(f.assistant)+'</span></div>';
  }
  if(f.anesth){
    var parts = Object.keys(f.anesth).map(function(k){
      if(!k) return fmtEur(f.anesth[k]);
      return k.charAt(0)+k.slice(1).toLowerCase()+': '+fmtEur(f.anesth[k]);
    });
    rowsHtml += '<div class="fee-row"><span class="fee-lbl"><i class="ti ti-mask" style="font-size:13px;margin-right:5px;"></i>Αναισθησιολόγος</span><span class="fee-val">'+parts.join('<br>')+'</span></div>';
  }
  if(f.note){
    rowsHtml += '<div class="fee-note"><div class="fee-note-title"><i class="ti ti-notes" style="font-size:13px;margin-right:5px;"></i>Παρατήρηση / Συμφωνία</div><div class="fee-note-text">'+escapeHtml(f.note)+'</div></div>';
  }
  var host = document.createElement('div');
  host.className='fee-pop-backdrop';
  host.onclick=function(e){ if(e.target===host) closeFeePopover(host); };
  var onEsc = function(e){ if(e.key==='Escape') closeFeePopover(host); };
  document.addEventListener('keydown', onEsc);
  host._onEsc = onEsc;
  host.innerHTML = '<div class="fee-pop"><h4>'+escapeHtml(r.description)+'</h4>'+rowsHtml+'<button class="fee-close" onclick="closeFeePopover(this.closest(\'.fee-pop-backdrop\'))">Κλείσιμο</button></div>';
  document.body.appendChild(host);
}
var _lastRenderedRows = [];
function renderRows(){
  var rows = getFilteredRows();
  _lastRenderedRows = rows;
  var nq = norm(currentQuery);
  var body = document.getElementById('rowsBody');
  var isEthniki = INSURERS[currentIns].key === 'ETHNIKI';
  if(!rows.length){ body.innerHTML = '<tr><td colspan="5"><div class="empty-note">Δεν βρέθηκαν πράξεις.</div></td></tr>'; return; }
  var capped = rows.length > 500 && !nq && !currentCat && !currentSpecialty;
  var toRender = capped ? rows.slice(0, 500) : rows;
  body.innerHTML = toRender.map(function(r,i){
    var numIdx = CAT_ORDER.indexOf(r.category_label)+1;
    var feeCell = '<td class="fee"></td>';
    if(isEthniki){
      var f = getFeesFor(r);
      feeCell = f ? '<td class="fee"><button class="fee-chip" onclick="showFeePopover('+i+', _lastRenderedRows)">€ Δες</button></td>' : '<td class="fee"><span class="fee-chip none">—</span></td>';
    } else {
      feeCell = '<td class="fee"><span class="fee-chip none" title="Οι αμοιβές είναι διαθέσιμες μόνο για ΕΘΝΙΚΗ">—</span></td>';
    }
    var catCell = r.category_label ? '<td><span class="cat-badge '+catClass(numIdx||1)+'">'+r.category_label+'</span></td>' : '<td></td>';
    return '<tr><td class="code">'+(r.code||'')+'</td><td class="desc">'+highlightMark(r.description, nq)+'</td><td style="color:var(--mut);font-size:11.5px;">'+r.specialty+'</td>'+catCell+feeCell+'</tr>';
  }).join('') + (capped ? '<tr><td colspan="5"><div class="gs-more">Δείχνονται οι πρώτες 500 από '+rows.length+' — γράψε κάτι στην αναζήτηση για να στενέψεις τα αποτελέσματα</div></td></tr>' : '');
}


var FOLLOW_CALC_FEES = {
  follow:{flat2:181,d3_5:90,d6_20:68,d21:46,label:'Παρακολούθηση'},
  co:{flat2:226,d3_5:112,d6_20:82,d21:59,label:'Συμπαρακολούθηση'}
};
var followCalcMode = 'follow';

function followCalcEuro(v){
  return v.toLocaleString('el-GR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
}
function followCalcOverlap(start,end,bandStart,bandEndExclusive){
  var a=Math.max(start,bandStart), b=Math.min(end,bandEndExclusive);
  return Math.max(0,b-a);
}
function closeFollowCalculator(host){
  host = host || document.getElementById('followCalcBackdrop');
  if(!host) return;
  if(host._onEsc) document.removeEventListener('keydown',host._onEsc);
  host.remove();
}
function setFollowCalcMode(mode){
  followCalcMode = mode;
  var a=document.getElementById('followModeBtn'), b=document.getElementById('coModeBtn');
  if(a) a.classList.toggle('active',mode==='follow');
  if(b) b.classList.toggle('active',mode==='co');
  calculateFollowFee();
}
function calculateFollowFee(){
  var startEl=document.getElementById('followStartDay');
  var endEl=document.getElementById('followEndDay');
  var result=document.getElementById('followCalcResult');
  var error=document.getElementById('followCalcError');
  if(!startEl||!endEl||!result||!error) return;

  error.style.display='none';
  result.classList.add('hidden');

  var start=Number(startEl.value), end=Number(endEl.value);
  if(!Number.isInteger(start)||!Number.isInteger(end)||start<0||end<0){
    error.textContent='Βάλε έγκυρες ακέραιες ημέρες νοσηλείας.';
    error.style.display='block'; return;
  }
  if(start===0 && end===0) return;
  if(start<1 || end<1){
    error.textContent='Για να γίνει υπολογισμός, συμπλήρωσε ημέρα έναρξης και ημέρα λήξης.';
    error.style.display='block'; return;
  }
  if(end<=start){
    error.textContent='Η ημέρα λήξης πρέπει να είναι μεγαλύτερη από την ημέρα έναρξης.';
    error.style.display='block'; return;
  }

  var f=FOLLOW_CALC_FEES[followCalcMode], rows=[], total=0;
  var early=followCalcOverlap(start,end,1,3);
  if(early>0){
    total+=f.flat2;
    rows.push({band:'1η–2η ημέρα',calc:'Ενιαία αμοιβή',amount:f.flat2});
  }
  var d35=followCalcOverlap(start,end,3,6);
  if(d35>0){
    var a35=d35*f.d3_5; total+=a35;
    rows.push({band:'3η–5η ημέρα',calc:d35+' '+(d35===1?'ημέρα':'ημέρες')+' × '+followCalcEuro(f.d3_5),amount:a35});
  }
  var d620=followCalcOverlap(start,end,6,21);
  if(d620>0){
    var a620=d620*f.d6_20; total+=a620;
    rows.push({band:'6η–20ή ημέρα',calc:d620+' '+(d620===1?'ημέρα':'ημέρες')+' × '+followCalcEuro(f.d6_20),amount:a620});
  }
  var d21=Math.max(0,end-Math.max(start,21));
  if(d21>0){
    var a21=d21*f.d21; total+=a21;
    rows.push({band:'21η ημέρα και άνω',calc:d21+' '+(d21===1?'ημέρα':'ημέρες')+' × '+followCalcEuro(f.d21),amount:a21});
  }

  document.getElementById('followCalcResultLabel').textContent=f.label;
  document.getElementById('followCalcTotal').textContent=followCalcEuro(total);
  document.getElementById('followCalcDays').innerHTML='Από <b>'+start+'η</b> έως <b>'+end+'η</b> ημέρα<br><b>'+(end-start)+'</b> χρεώσιμες ημέρες';
  document.getElementById('followCalcBreakdown').innerHTML=rows.map(function(r){
    return '<tr><td>'+r.band+'</td><td>'+r.calc+'</td><td><b>'+followCalcEuro(r.amount)+'</b></td></tr>';
  }).join('');
  result.classList.remove('hidden');
}

            '<div class="follow-rate-box"><strong>Συμπαρακολούθηση</strong>'+

function toggleDark(){
  var isDark=document.documentElement.hasAttribute('data-dark');
  if(isDark){ document.documentElement.removeAttribute('data-dark'); localStorage.setItem('mediDark','0'); }
  else { document.documentElement.setAttribute('data-dark',''); localStorage.setItem('mediDark','1'); }
}
(function(){
  if(localStorage.getItem('mediDark')==='1') document.documentElement.setAttribute('data-dark','');
})();

document.addEventListener('DOMContentLoaded', function(){
  renderInsTabs();
  updateView();
});
</script>
